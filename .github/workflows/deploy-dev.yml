# =============================================================================
# WORKFLOW: Ad-hoc Deploy to Dev Environment
# =============================================================================
#
# Trigger  : Manual (workflow_dispatch)
# Purpose  : One-click build + deploy to Dev without the full release pipeline.
#            Useful for hotfixes, ad-hoc testing, or pushing a specific solution
#            to Dev outside the normal three-phase pipeline.
#
# ARCHITECTURE:
#   Uses the same _stage-build / _stage-deploy-chain reusable stages as the
#   main pipeline (build-and-deploy.yml), scoped to Dev only via environments:'Dev'.
#   This is 2 levels of nesting (caller → stage), within GitHub's 4-level limit.
#
#   Avoids _job-deploy-dev.yml which introduced 3-level cross-repo nesting
#   (deploy-dev → _job-deploy-dev → _job-build), rejected by GitHub at parse time.
#
# =============================================================================

name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Solutions to build and deploy.
          "all" = every solution in solutions.json (default).
          Comma-separated for a subset: "CoreSolution" or "CoreSolution, ExtA".
        required: false
        default: 'all'

      mock_deploy:
        description: 'Dry run — simulate build and deploy without touching Power Platform or JFrog'
        required: false
        default: false
        type: boolean

      checker_error_level:
        description: 'Minimum severity that fails Solution Checker'
        required: false
        default: 'HighIssue'
        type: choice
        options:
          - CriticalIssue
          - HighIssue
          - MediumIssue
          - LowIssue
          - InformationalIssue

      enable_backup:
        description: 'Export existing Dev solution as backup before importing'
        required: false
        default: false
        type: boolean

      import_config_data:
        description: 'Import configuration migration data after solution import'
        required: false
        default: false
        type: boolean

concurrency:
  group: "deploy-dev-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Setup — resolve solution matrix
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    outputs:
      matrix:         ${{ steps.resolve.outputs.matrix }}
      solution_list:  ${{ steps.resolve.outputs.solution_list }}
      solution_count: ${{ steps.resolve.outputs.solution_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/templates/steps/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

  # ============================================================================
  # Build — pack ZIPs + Solution Checker
  # Uploads solution-artifact-* to GitHub storage for the deploy stage.
  # JFrog upload is skipped (no archival needed for ad-hoc Dev deploys).
  # ============================================================================
  stage-build:
    name: "🏗️ Build"
    needs: setup
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      jfrog_url:              ''        # no JFrog archival for ad-hoc Dev deploys
      jfrog_repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      checker_error_level:    ${{ inputs.checker_error_level || 'HighIssue' }}
    secrets: inherit

  # ============================================================================
  # Deploy — Dev only
  # Sequential deployment with GitHub Environment gate.
  # ============================================================================
  stage-deploy:
    name: "🚀 Deploy → Dev"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-deploy-chain.yml@main
    with:
      matrix:          ${{ needs.setup.outputs.matrix }}
      environments:    'Dev'
      mock_deploy:     ${{ inputs.mock_deploy == true }}
      trigger_upgrade: false
      base_solutions:  ${{ vars.PP_BASE_SOLUTIONS || '' }}
      jfrog_url:       ''
      jfrog_repo:      ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      run_number:      ${{ github.run_number }}
      run_attempt:     ${{ github.run_attempt }}

      dev_config: >-
        {"name":"Dev","url":"${{ vars.PP_DEV_URL }}","previous_url":"",
        "solution_type":"Unmanaged","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":false,"enable_version_compare":false,
        "import_config_data":${{ inputs.import_config_data == true }}}

      # Required inputs — filtered out by environments:'Dev', never deployed
      intg_config: >-
        {"name":"Intg","url":"${{ vars.PP_INTG_URL }}","previous_url":"${{ vars.PP_DEV_URL }}",
        "solution_type":"Managed","enable_backup":false,
        "enable_blocking_check":true,"enable_version_compare":false,
        "import_config_data":false}

      uat_config: >-
        {"name":"UAT","url":"${{ vars.PP_UAT_URL }}","previous_url":"${{ vars.PP_INTG_URL }}",
        "solution_type":"Managed","enable_backup":true,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      frs_config: >-
        {"name":"FRS","url":"${{ vars.PP_FRS_URL }}","previous_url":"${{ vars.PP_UAT_URL }}",
        "solution_type":"Managed","enable_backup":true,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      perf_config: >-
        {"name":"Perf","url":"${{ vars.PP_PERF_URL }}","previous_url":"${{ vars.PP_FRS_URL }}",
        "solution_type":"Managed","enable_backup":false,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      prod_config: >-
        {"name":"Prod","url":"${{ vars.PP_PROD_URL }}","previous_url":"${{ vars.PP_PERF_URL }}",
        "solution_type":"Managed","enable_backup":true,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":true}

    secrets: inherit

  # ============================================================================
  # Summary (always runs)
  # ============================================================================
  deploy-summary:
    name: "📋 Deploy Dev Summary"
    needs: [setup, stage-build, stage-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          BUILD="${{ needs.stage-build.result }}"
          DEPLOY="${{ needs.stage-deploy.result }}"
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deploy to Dev — Summary

          | Field | Value |
          | --- | --- |
          | Solutions | ${{ needs.setup.outputs.solution_list }} |
          | Run | #${{ github.run_number }} |
          | Triggered by | @${{ github.actor }} |
          | Build | $(icon "$BUILD") $BUILD |
          | Deploy → Dev | $(icon "$DEPLOY") $DEPLOY |
          EOF

      - name: Send failure notification
        if: needs.stage-build.result == 'failure' || needs.stage-deploy.result == 'failure'
        continue-on-error: true   # mail secrets optional — don't fail the job if not configured
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ppudot1@gmail.com
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject:        "❌ Deploy to Dev FAILED — ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Ad-hoc Dev deployment failed for run #${{ github.run_number }}.

            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Solutions   : ${{ needs.setup.outputs.solution_list }}

            Build result : ${{ needs.stage-build.result }}
            Deploy result: ${{ needs.stage-deploy.result }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
