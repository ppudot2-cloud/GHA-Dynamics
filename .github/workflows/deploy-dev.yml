# =============================================================================
# WORKFLOW: Ad-hoc Deploy to Dev Environment
# =============================================================================
# Trigger  : Manual (workflow_dispatch)
# Delegates: All logic lives in GHA-Core/_reusable-deploy-dev.yml.
#
# This file is intentionally thin — it exists only to:
#   1. Expose the workflow_dispatch UI with typed inputs and descriptions
#   2. Read repository variables (vars.*) which cannot cross repo boundaries
#   3. Forward everything to the reusable workflow in GHA-Core
#
# To change deploy logic, edit:
#   GHA-Core/.github/workflows/_reusable-deploy-dev.yml
# =============================================================================

name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Solutions to build and deploy.
          "all" = every solution in src/solutions/ (default).
          Comma-separated for a subset: "CoreSolution" or "CoreSolution, ExtA, ExtB".
        required: false
        default: 'all'
      enable-backup:
        description: 'Backup Dev before deploying'
        required: false
        default: false
        type: boolean
      enable-blocking-check:
        description: 'Warn on in-progress async operations before importing'
        required: false
        default: false
        type: boolean
      mock-deploy:
        description: 'Dry run only — skip actual import'
        required: false
        default: false
        type: boolean
      import-config-data:
        description: 'Import config data after solution import'
        required: false
        default: false
        type: boolean

jobs:
  deploy-dev:
    name: "Deploy to Dev"
    uses: YOUR_ORG/GHA-Core/.github/workflows/_reusable-deploy-dev.yml@main
    with:
      # ── User inputs ────────────────────────────────────────────────────────
      solutions:              ${{ inputs.solutions || 'all' }}
      enable-backup:          ${{ inputs.enable-backup == true }}
      enable-blocking-check:  ${{ inputs.enable-blocking-check == true }}
      mock-deploy:            ${{ inputs.mock-deploy == true }}
      import-config-data:     ${{ inputs.import-config-data == true }}
      # ── Repository variables (read here — not accessible inside GHA-Core) ──
      pp-dev-url:             ${{ vars.PP_DEV_URL }}
      pp-checker-geo:         ${{ vars.PP_CHECKER_GEO || 'UnitedStates' }}
      pp-checker-error-level: ${{ vars.PP_CHECKER_ERROR_LEVEL || 'HighIssue' }}
      pp-solution-name:       ${{ vars.PP_SOLUTION_NAME || '' }}
      pp-data-schema-file:    ${{ vars.PP_DATA_SCHEMA_FILE || '' }}
      pp-sdbx-url:            ${{ vars.PP_SDBX_URL || '' }}
      jfrog-url:              ${{ vars.JFROG_URL || '' }}
      jfrog-repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
    secrets: inherit
