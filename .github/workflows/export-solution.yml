# =============================================================================
# WORKFLOW: Export Solution(s) from Sandbox → GitHub Branch
# =============================================================================
# Trigger  : Manual (workflow_dispatch) — run by makers after customising in SDBX
# Purpose  : Exports one or more solutions from the sandbox environment,
#            unpacks them to source files, exports config data (optional),
#            resets build numbers, commits all changes to a shared feature
#            branch, and opens a single PR to main.
#
# MULTI-SOLUTION BEHAVIOUR:
#   Each selected solution is exported sequentially on the SAME feature branch
#   (max-parallel: 1 — Power Platform platform constraint).
#   A single Pull Request is created after all exports complete.
#
# MOCK_DEPLOY MODE (mock_deploy=true):
#   who-am-i             → simulated (logs mock connection)
#   publish_before_export → simulated (logs what would publish)
#   export-solution      → simulated (packs existing source via PAC CLI)
#   unpack-solution      → simulated (unpacks to out/unpack-verify/, diffs vs source)
#   export_config_data   → simulated (parses schema, creates placeholder ZIP)
#   commit/push          → simulated (git diff --stat, no push) via PS script
#   create-pr            → simulated (prints PR details, no gh pr create)
# =============================================================================

name: Export Solution from Sandbox

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Which solution(s) to export.
          "all" = every solution in src/solutions/ (default).
          Comma-separated subset: "CoreSolution" or "CoreSolution, ExtA, ExtB".
        required: false
        default: 'all'

      branch_name:
        description: 'Feature branch to commit to (blank = auto-generate)'
        required: false
        default: ''

      create_pr:
        description: 'Open a Pull Request to main after all exports complete'
        required: false
        default: true
        type: boolean

      commit_message:
        description: 'Git commit message prefix'
        required: false
        default: 'chore: export solution(s) from sandbox'

      export_config_data:
        description: 'Export configuration migration data for each solution'
        required: false
        default: false
        type: boolean

      publish_before_export:
        description: 'Publish customizations in sandbox before exporting'
        required: false
        default: true
        type: boolean

      mock_deploy:
        description: 'Dry-run — simulate the full export flow. No PP credentials required.'
        required: false
        default: false
        type: boolean

jobs:
  # ============================================================================
  # JOB 0 ─ Setup
  # Resolves the solution list and generates the shared branch name so every
  # sequential export instance commits to the exact same branch.
  # ============================================================================
  setup:
    name: "🔍 Resolve Solutions & Branch"
    runs-on: ubuntu-latest
    outputs:
      matrix:          ${{ steps.resolve.outputs.matrix }}
      solution_list:   ${{ steps.resolve.outputs.solution_list }}
      solution_count:  ${{ steps.resolve.outputs.solution_count }}
      branch_name:     ${{ steps.set-branch.outputs.branch_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution list
        id: resolve
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName '${{ vars.PP_SOLUTION_NAME }}'

      - name: Set branch name
        id: set-branch
        shell: pwsh
        run: |
          $requested = '${{ inputs.branch_name }}'.Trim()
          if ($requested) {
            $branch = $requested
          } else {
            $date   = Get-Date -Format 'yyyyMMdd'
            $branch = "export/sdbx-$date-${{ github.run_number }}"
          }
          "branch_name=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Branch: $branch"

  # ============================================================================
  # JOB 1 ─ Export (SEQUENTIAL per solution — max-parallel: 1)
  # PP platform constraint: parallel Dataverse export operations conflict.
  # ============================================================================
  export:
    name: "📤 Export | ${{ matrix.solution }}"
    needs: setup
    if: needs.setup.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false

    env:
      SOLUTION:        ${{ matrix.solution }}
      BRANCH_NAME:     ${{ needs.setup.outputs.branch_name }}
      SOLUTION_FOLDER: src/solutions/${{ matrix.solution }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref:        main
          fetch-depth: 0
          token:      ${{ secrets.GITHUB_TOKEN }}

      # ── 1b. Checkout GHA-Core (reveille composite action) ────────────────────
      - name: Checkout GHA-Core CI
        if: inputs.mock_deploy != true
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref:        main
          path:       .ci
          token:      ${{ secrets.GHA_CORE_PAT }}

      # ── 1c. Azure OIDC login + AKV credential fetch ───────────────────────────
      # Populates PP_APP_ID, PP_CLIENT_SECRET, PP_TENANT_ID (and others) into
      # GITHUB_ENV with ::add-mask:: applied. Skipped in mock_deploy mode.
      - name: Azure login & AKV credential fetch (reveille)
        if: inputs.mock_deploy != true
        uses: .ci/.github/actions/reveille
        with:
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}

      # ── 2. Install PAC CLI ────────────────────────────────────────────────────
      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      # ── 3. Configure git ─────────────────────────────────────────────────────
      - name: Configure git
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = '${{ needs.setup.outputs.branch_name }}'
          $exists = git ls-remote --heads origin $branch 2>&1
          if ($exists) {
            git checkout $branch
            git pull origin $branch --rebase
            Write-Host "✅ Checked out existing branch: $branch"
          } else {
            git checkout -b $branch
            Write-Host "✅ Created new branch: $branch"
          }

      # ── 4a. Validate auth — who-am-i (REAL) ──────────────────────────────────
      - name: Validate connection — who-am-i
        id: who-am-i
        if: inputs.mock_deploy != true
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ vars.PP_SDBX_URL }}
          app-id:          ${{ env.PP_APP_ID }}
          client-secret:   ${{ env.PP_CLIENT_SECRET }}
          tenant-id:       ${{ env.PP_TENANT_ID }}

      # ── 4b. Validate auth — SIMULATION ───────────────────────────────────────
      - name: "🧪 Validate connection — Simulation (mock_deploy)"
        if: inputs.mock_deploy == true
        shell: pwsh
        run: |
          Write-Host "🧪 [MOCK] Would connect to: ${{ vars.PP_SDBX_URL }}"
          "🧪 **mock_deploy=true** — who-am-i simulated (no actual connection to sandbox)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # ── 5a. Publish customizations (REAL) ────────────────────────────────────
      - name: Publish customizations before export
        id: publish-real
        if: inputs.publish_before_export == true && inputs.mock_deploy != true
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url:     ${{ vars.PP_SDBX_URL }}
          app-id:              ${{ env.PP_APP_ID }}
          client-secret:       ${{ env.PP_CLIENT_SECRET }}
          tenant-id:           ${{ env.PP_TENANT_ID }}
          run-asynchronously:  true
          max-async-wait-time: 60

      # ── 5b. Publish customizations — SIMULATION ───────────────────────────────
      - name: "🧪 Publish customizations — Simulation (mock_deploy)"
        if: inputs.publish_before_export == true && inputs.mock_deploy == true
        shell: pwsh
        run: |
          Write-Host "🧪 [MOCK] Would publish customizations on: ${{ vars.PP_SDBX_URL }}"
          "🧪 **Publish customizations** simulated — no changes made to sandbox" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # ── 6a. Export solution (REAL) ────────────────────────────────────────────
      - name: Export solution from sandbox
        id: export-real
        if: inputs.mock_deploy != true
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.PP_SDBX_URL }}
          app-id:          ${{ env.PP_APP_ID }}
          client-secret:   ${{ env.PP_CLIENT_SECRET }}
          tenant-id:       ${{ env.PP_TENANT_ID }}
          solution-name:   ${{ matrix.solution }}
          solution-output-file: "out/${{ matrix.solution }}.zip"
          managed:         false

      # ── 6b. Export solution — SIMULATION (pack from existing source) ──────────
      # Performs a round-trip: packs existing source → ZIP using PAC CLI.
      # This validates the source is packable without touching live Dataverse.
      - name: "🧪 Export solution — Simulation (mock_deploy)"
        id: export-sim
        if: inputs.mock_deploy == true
        shell: pwsh
        run: |
          $outDir = "out/${{ matrix.solution }}"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Write-Host "🧪 [MOCK] Packing existing source as round-trip test..."
          "🧪 **Export** simulated — packing existing source as round-trip test" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: "🧪 Pack existing source (round-trip test)"
        if: inputs.mock_deploy == true
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: "src/solutions/${{ matrix.solution }}"
          solution-file:   "out/${{ matrix.solution }}.zip"
          solution-type:   "Unmanaged"

      # ── 7a. Unpack solution (REAL) ────────────────────────────────────────────
      - name: Unpack solution to source
        id: unpack-real
        if: inputs.mock_deploy != true
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file:          "out/${{ matrix.solution }}.zip"
          solution-folder:        "src/solutions/${{ matrix.solution }}"
          solution-type:          "Unmanaged"
          overwrite-files:        true

      # ── 7b. Unpack solution — SIMULATION (diff check) ─────────────────────────
      - name: "🧪 Unpack solution — Simulation (round-trip integrity check)"
        id: unpack-sim
        if: inputs.mock_deploy == true
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file:   "out/${{ matrix.solution }}.zip"
          solution-folder: "out/unpack-verify/${{ matrix.solution }}"
          solution-type:   "Unmanaged"
          overwrite-files: true

      - name: "🧪 Diff round-trip output vs source"
        if: inputs.mock_deploy == true
        shell: pwsh
        run: |
          $original  = "src/solutions/${{ matrix.solution }}/Other/Solution.xml"
          $roundTrip = "out/unpack-verify/${{ matrix.solution }}/Other/Solution.xml"

          @"
          ## 🧪 Round-Trip Integrity Check — ${{ matrix.solution }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ((Test-Path $original) -and (Test-Path $roundTrip)) {
            $orig = (Get-Content $original -Raw) -replace '\s+', ' '
            $rt   = (Get-Content $roundTrip -Raw) -replace '\s+', ' '
            if ($orig -eq $rt) {
              "| ✅ Solution.xml | Round-trip matches source |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            } else {
              "| ⚠️ Solution.xml | Diff detected (expected on version stamp) |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }

          # File count comparison
          $srcCount  = (Get-ChildItem "src/solutions/${{ matrix.solution }}" -Recurse -File).Count
          $rtCount   = (Get-ChildItem "out/unpack-verify/${{ matrix.solution }}" -Recurse -File).Count
          "| 📂 File count | Source: $srcCount | Round-trip: $rtCount |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # ── 9a. Export config data (REAL) ─────────────────────────────────────────
      - name: Export configuration data
        id: export-config-real
        if: inputs.export_config_data == true && inputs.mock_deploy != true
        shell: pwsh
        run: |
          $schemaFile = '${{ vars.PP_DATA_SCHEMA_FILE }}'
          if (-not $schemaFile) {
            Write-Host "::warning::PP_DATA_SCHEMA_FILE variable not set — skipping config data export."
            exit 0
          }
        # NOTE: actual export-data action called after schema check

      - name: "Export configuration data — action"
        if: inputs.export_config_data == true && inputs.mock_deploy != true && vars.PP_DATA_SCHEMA_FILE != ''
        uses: microsoft/powerplatform-actions/export-data@v1
        with:
          environment-url: ${{ vars.PP_SDBX_URL }}
          app-id:          ${{ env.PP_APP_ID }}
          client-secret:   ${{ env.PP_CLIENT_SECRET }}
          tenant-id:       ${{ env.PP_TENANT_ID }}
          schema-file:     ${{ vars.PP_DATA_SCHEMA_FILE }}
          data-file:       "config/${{ matrix.solution }}/config-data.zip"
          overwrite:       true

      # ── 9b. Export config data — SIMULATION ───────────────────────────────────
      - name: "🧪 Export configuration data — Simulation (mock_deploy)"
        id: export-config-sim
        if: inputs.export_config_data == true && inputs.mock_deploy == true
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Export-ConfigDataSim.ps1 `
            -SchemaFile           '${{ vars.PP_DATA_SCHEMA_FILE }}' `
            -OutputZipPath        "config/${{ matrix.solution }}/config-data.zip" `
            -SourceEnvironmentUrl '${{ vars.PP_SDBX_URL }}' `
            -RunNumber            '${{ github.run_number }}'

      # ── 10a. Commit and push (REAL) ────────────────────────────────────────────
      - name: Commit and push changes
        id: commit-real
        if: inputs.mock_deploy != true
        shell: pwsh
        run: |
          git add --all
          $status = git status --porcelain
          if (-not $status) {
            Write-Host "ℹ️  No changes to commit for ${{ matrix.solution }}"
          } else {
            $msg = "${{ inputs.commit_message }} [${{ matrix.solution }}]"
            git commit -m $msg
            git push origin '${{ needs.setup.outputs.branch_name }}' --set-upstream
            Write-Host "✅ Pushed ${{ matrix.solution }} to ${{ needs.setup.outputs.branch_name }}"
          }

      # ── 10b. Commit dry-run — SIMULATION ──────────────────────────────────────
      - name: "🧪 Commit dry-run — Simulation (mock_deploy)"
        id: commit-sim
        if: inputs.mock_deploy == true
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Invoke-ExportCommitSim.ps1 `
            -SolutionName         '${{ matrix.solution }}' `
            -BranchName           '${{ needs.setup.outputs.branch_name }}' `
            -CommitMessagePrefix  '${{ inputs.commit_message }}' `
            -CreatePr             ([System.Convert]::ToBoolean('${{ inputs.create_pr }}'))

  # ============================================================================
  # JOB 2 ─ Create PR (after all sequential exports complete)
  # ONE PR bundles all exported solution changes.
  # ============================================================================
  create-pr:
    name: "🔀 Create Pull Request"
    needs: [setup, export]
    if: needs.export.result == 'success' && inputs.create_pr == true && inputs.mock_deploy != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch_name }}

      - name: Create Pull Request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch   = '${{ needs.setup.outputs.branch_name }}'
          $solList  = '${{ needs.setup.outputs.solution_list }}'
          $prTitle  = "chore: export solutions from sandbox [$solList]"
          $prBody   = @"
          ## Auto-generated Export PR

          **Solutions exported:** $solList
          **Source environment:** ${{ vars.PP_SDBX_URL }}
          **Run:** #${{ github.run_number }}
          **Branch:** $branch

          ### What's included
          All solution source changes and (if applicable) configuration migration data
          exported from the sandbox environment on $(Get-Date -Format 'yyyy-MM-dd').

          > Review changes, resolve conflicts if any, then merge to main.
          "@

          gh pr create `
            --title $prTitle `
            --body  $prBody `
            --head  $branch `
            --base  main `
            --label "export,automated" `
            2>&1 | Write-Host

          Write-Host "✅ PR created: $prTitle"
          "✅ **PR Created** — [$prTitle]" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
