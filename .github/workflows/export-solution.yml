# =============================================================================
# WORKFLOW: Export Solution(s) from Sandbox → GitHub Branch
# =============================================================================
# Trigger  : Manual (workflow_dispatch) — run by makers after customising in SDBX
# Purpose  : Exports one or more solutions from the sandbox environment,
#            unpacks them to source files, exports config data (optional),
#            resets build numbers, commits all changes to a shared feature
#            branch, and opens a single PR to main.
#
# ┌─ SCENARIO SUPPORT ──────────────────────────────────────────────────────┐
# │  Single-solution repo : leave `solutions` as "all".                     │
# │  Multi-solution repo  : select what to export:                          │
# │    "all"                  → export every solution in src/solutions/     │
# │    "CoreSolution"         → export one solution                         │
# │    "CoreSolution, ExtA"   → export an explicit subset                   │
# └─────────────────────────────────────────────────────────────────────────┘
#
# MULTI-SOLUTION BEHAVIOUR:
#   Each selected solution is exported sequentially on the SAME feature branch
#   (max-parallel: 1). A single Pull Request is created after all exports
#   complete, bundling all changes into one review.
#
# MOCK-DEPLOY MODE (mock-deploy=true):
#   All steps run as simulations — no PP credentials or live Dataverse required.
#   who-am-i            → simulated (logs mock connection)
#   publish-before-export → simulated (logs what would publish)
#   export-solution     → simulated (packs existing source → ZIP using PAC CLI)
#   unpack-solution     → simulated (unpacks to out/unpack-verify/, diffs vs source)
#   export-config-data  → simulated (parses schema, creates placeholder ZIP)
#   commit/push         → simulated (git diff --stat shows what would change, no push)
#   create-pr           → simulated (prints PR title + body, no gh pr create)
# =============================================================================

name: Export Solution from Sandbox

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Which solution(s) to export.
          "all" = every solution in src/solutions/ (default).
          Comma-separated for a subset: "CoreSolution" or "CoreSolution, ExtA, ExtB".
          Single-solution repos: leave as "all".
        required: false
        default: 'all'
      branch-name:
        description: 'Feature branch to commit to (blank = auto-generate)'
        required: false
        default: ''
      create-pr:
        description: 'Open a Pull Request to main after all exports complete'
        required: false
        default: true
        type: boolean
      commit-message:
        description: 'Git commit message prefix'
        required: false
        default: 'chore: export solution(s) from sandbox'
      export-config-data:
        description: 'Export configuration migration data for each solution'
        required: false
        default: false
        type: boolean
      publish-before-export:
        description: 'Publish customizations in sandbox before exporting'
        required: false
        default: true
        type: boolean
      process-canvas-apps:
        description: 'Unpack Canvas App .msapp to YAML source'
        required: false
        default: true
        type: boolean
      mock-deploy:
        description: 'Dry-run — simulate the full export flow using existing source files. No PP credentials or live Dataverse required.'
        required: false
        default: false
        type: boolean

jobs:
  # ============================================================================
  # JOB 0 ─ Setup
  # Resolves the solution list and generates the shared branch name so every
  # sequential export instance commits to the exact same branch.
  # ============================================================================
  setup:
    name: "🔍 Resolve Solutions & Branch"
    runs-on: ubuntu-latest
    outputs:
      matrix:         ${{ steps.resolve.outputs.matrix }}
      solution-list:  ${{ steps.resolve.outputs.solution-list }}
      solution-count: ${{ steps.resolve.outputs.solution-count }}
      branch-name:    ${{ steps.resolve.outputs.branch-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve solution list and branch name
        id: resolve
        shell: python3 {0}
        run: |
          import json, os, sys
          from datetime import datetime

          input_solutions  = "${{ inputs.solutions || 'all' }}".strip()
          input_branch     = "${{ inputs.branch-name }}".strip()
          pp_solution_name = "${{ vars.PP_SOLUTION_NAME }}".strip()
          solutions_dir    = "src/solutions"
          config_file      = ".github/solutions-config.json"

          # ── 1. Discover solutions from filesystem ──────────────────────────
          discovered = []
          if os.path.isdir(solutions_dir):
              discovered = sorted([
                  d for d in os.listdir(solutions_dir)
                  if os.path.isdir(os.path.join(solutions_dir, d)) and not d.startswith(".")
              ])

          # ── 2. Determine the selected solution set ─────────────────────────
          if input_solutions.lower() == "all":
              if discovered:
                  selected = discovered
                  print(f"ℹ️  Exporting all {len(discovered)} solution(s)")
              elif pp_solution_name:
                  selected = [pp_solution_name]
                  print(f"ℹ️  Using PP_SOLUTION_NAME: {pp_solution_name}")
              else:
                  print("::error::No solutions found in src/solutions/ and PP_SOLUTION_NAME is not set.")
                  sys.exit(1)
          else:
              selected = [s.strip() for s in input_solutions.split(",") if s.strip()]
              if not selected:
                  print("::error::The 'solutions' input is empty after parsing.")
                  sys.exit(1)
              if discovered:
                  unknown = [s for s in selected if s not in discovered]
                  if unknown:
                      print(f"::error::Solution(s) not found in {solutions_dir}/: {', '.join(unknown)}")
                      print(f"::error::Available: {', '.join(discovered)}")
                      sys.exit(1)

          # ── 3. Apply ordering from config (optional) ───────────────────────
          if os.path.isfile(config_file):
              try:
                  with open(config_file) as f:
                      config = json.load(f)
                  selected_set = set(selected)
                  ordered = []
                  for entry in config.get("solutions", []):
                      name = entry["name"] if isinstance(entry, dict) else str(entry)
                      if name in selected_set:
                          ordered.append(name)
                          selected_set.discard(name)
                  ordered.extend(sorted(selected_set))
                  selected = ordered
              except Exception:
                  pass

          # ── 4. Determine branch name ───────────────────────────────────────
          if input_branch:
              branch = input_branch
          elif len(selected) == 1:
              ts = datetime.utcnow().strftime("%Y%m%d-%H%M")
              branch = f"export/{selected[0]}-{ts}"
          else:
              ts = datetime.utcnow().strftime("%Y%m%d-%H%M")
              branch = f"export/multi-{ts}-run-${{ github.run_number }}"

          # ── 5. Write outputs ───────────────────────────────────────────────
          matrix        = json.dumps({"solution": selected})
          solution_list = ", ".join(selected)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"solution-list={solution_list}\n")
              f.write(f"solution-count={len(selected)}\n")
              f.write(f"branch-name={branch}\n")

          print(f"\n✅ {len(selected)} solution(s) to export: {solution_list}")
          print(f"📌 Target branch: {branch}")

  # ============================================================================
  # JOB 1 ─ Export (SEQUENTIAL — max-parallel: 1)
  # Each instance exports one solution, commits to the shared branch, and
  # pushes. Sequential execution prevents git conflicts on the same branch.
  # ============================================================================
  export:
    name: "📤 Export | ${{ matrix.solution }}"
    needs: setup
    if: needs.setup.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1     # MUST be 1 — all instances commit to the same branch
      fail-fast: false
    runs-on: ubuntu-latest

    env:
      SOLUTION_FOLDER:  src/solutions/${{ matrix.solution }}
      DATA_SCHEMA_FILE: config/${{ matrix.solution }}/data-schema.xml
      BRANCH_NAME:      ${{ needs.setup.outputs.branch-name }}

    steps:
      # ── 1. Checkout (full history for branch operations) ────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Set up (or sync) the shared feature branch ───────────────────
      - name: Set up feature branch
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch if it doesn't exist remotely; otherwise check it out
          if git ls-remote --exit-code origin "${{ env.BRANCH_NAME }}" > /dev/null 2>&1; then
            git fetch origin "${{ env.BRANCH_NAME }}"
            git checkout "${{ env.BRANCH_NAME }}"
            git pull --rebase origin "${{ env.BRANCH_NAME }}"
            echo "ℹ️ Checked out existing branch: ${{ env.BRANCH_NAME }}"
          else
            git checkout -b "${{ env.BRANCH_NAME }}"
            echo "ℹ️ Created new branch: ${{ env.BRANCH_NAME }}"
          fi

      # ── 3. Install PAC CLI ───────────────────────────────────────────────
      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      # ── 4a. Validate sandbox connection — REAL ──────────────────────────────
      - name: Validate sandbox connection (who-am-i)
        if: inputs.mock-deploy != true
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ vars.PP_SDBX_URL }}
          app-id:          ${{ secrets.PP_APP_ID }}
          client-secret:   ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id:       ${{ secrets.PP_TENANT_ID }}

      # ── 4b. Validate sandbox connection — SIMULATION ─────────────────────
      - name: "🧪 Validate sandbox connection — Simulation (mock-deploy)"
        if: inputs.mock-deploy == true
        shell: bash
        run: |
          SDBX="${{ vars.PP_SDBX_URL }}"
          echo "## 🧪 Export Simulation — ${{ matrix.solution }}" >> "$GITHUB_STEP_SUMMARY"
          echo "_mock-deploy=true — no PP credentials or live Dataverse used_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sandbox connection | 🧪 Simulated — would connect to \`${SDBX:-PP_SDBX_URL not set}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Sandbox connection SIMULATED — no actual authentication performed."

      # ── 5a. Publish customizations in sandbox — REAL (optional) ─────────
      - name: Publish customizations in sandbox
        if: inputs.publish-before-export == true && inputs.mock-deploy != true
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url:     ${{ vars.PP_SDBX_URL }}
          app-id:              ${{ secrets.PP_APP_ID }}
          client-secret:       ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id:           ${{ secrets.PP_TENANT_ID }}
          run-asynchronously:  true
          max-async-wait-time: 10

      # ── 5b. Publish customizations — SIMULATION ──────────────────────────
      - name: "🧪 Publish customizations — Simulation (mock-deploy)"
        if: inputs.publish-before-export == true && inputs.mock-deploy == true
        shell: bash
        run: |
          echo "| Publish customizations | 🧪 Simulated — publish-customizations would run on \`${{ vars.PP_SDBX_URL || 'PP_SDBX_URL not set' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Publish customizations SIMULATED — no actual Dataverse call performed."

      # ── 6a. Export solution (unmanaged) — REAL ───────────────────────────
      - name: Export solution — ${{ matrix.solution }}
        if: inputs.mock-deploy != true
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url:      ${{ vars.PP_SDBX_URL }}
          app-id:               ${{ secrets.PP_APP_ID }}
          client-secret:        ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id:            ${{ secrets.PP_TENANT_ID }}
          solution-name:        ${{ matrix.solution }}
          solution-output-file: out/${{ matrix.solution }}.zip
          managed:              false
          run-asynchronously:   true
          max-async-wait-time:  60
          overwrite:            true

      # ── 6b. Export solution — SIMULATION ─────────────────────────────────
      # Packs the existing source files using PAC CLI to produce a real ZIP.
      # This proves the current source is structurally valid and produces the
      # same artifact that downstream unpack/verify steps operate on.
      - name: "🧪 Export solution — Simulation (pack existing source)"
        if: inputs.mock-deploy == true
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder:  "${{ env.SOLUTION_FOLDER }}"
          solution-file:    "out/${{ matrix.solution }}.zip"
          solution-type:    "Unmanaged"
          process-canvas-apps: ${{ inputs.process-canvas-apps }}

      - name: "🧪 Log simulated export"
        if: inputs.mock-deploy == true
        shell: bash
        run: |
          ZIP="out/${{ matrix.solution }}.zip"
          if [ -f "$ZIP" ]; then
            SIZE=$(du -sh "$ZIP" | cut -f1)
            FILE_COUNT=$(unzip -l "$ZIP" 2>/dev/null | tail -1 | awk '{print $2}')
            echo "| Export solution | 🧪 Simulated — packed existing source → \`$ZIP\` ($SIZE, $FILE_COUNT files) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Export solution | ❌ Pack failed — ZIP not produced |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Simulated export (pack) failed — $ZIP was not created."
            exit 1
          fi

      # ── 7a. Unpack solution to source files — REAL ───────────────────────
      - name: Unpack solution — ${{ matrix.solution }}
        if: inputs.mock-deploy != true
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file:       out/${{ matrix.solution }}.zip
          solution-folder:     ${{ env.SOLUTION_FOLDER }}
          solution-type:       Unmanaged
          overwrite-files:     true
          process-canvas-apps: ${{ inputs.process-canvas-apps }}

      # ── 7b. Unpack solution — SIMULATION (round-trip integrity check) ─────
      # Unpacks the simulated ZIP to a SEPARATE verification folder so source
      # files in src/solutions/ are NOT overwritten. Compares key manifests
      # between original source and the round-trip output.
      - name: "🧪 Unpack solution — Simulation (round-trip integrity check)"
        if: inputs.mock-deploy == true
        shell: bash
        run: |
          VERIFY_DIR="out/unpack-verify/${{ matrix.solution }}"
          mkdir -p "$VERIFY_DIR"

          echo "::group::Unpacking simulated ZIP for round-trip check"
          pac solution unpack \
            --zipfile "out/${{ matrix.solution }}.zip" \
            --folder  "$VERIFY_DIR" \
            --packagetype Unmanaged \
            --allowDelete || true
          echo "::endgroup::"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Round-trip Integrity Check" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          for REL_PATH in "Other/Solution.xml" "Other/Customizations.xml"; do
            SRC="${{ env.SOLUTION_FOLDER }}/$REL_PATH"
            VER="$VERIFY_DIR/$REL_PATH"

            if [ ! -f "$SRC" ]; then
              echo "| \`$REL_PATH\` | ⚠️  Source file missing |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ ! -f "$VER" ]; then
              echo "| \`$REL_PATH\` | ⚠️  Not produced by unpack |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            DIFF=$(diff --strip-trailing-cr <(grep -v "^$" "$SRC") <(grep -v "^$" "$VER") 2>/dev/null | wc -l)
            if [ "$DIFF" -eq 0 ]; then
              echo "| \`$REL_PATH\` | ✅ Identical (round-trip clean) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$REL_PATH\` | ℹ️  $DIFF line(s) differ — PAC CLI may normalise formatting |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Show file counts
          SRC_COUNT=$(find "${{ env.SOLUTION_FOLDER }}" -type f | wc -l)
          VER_COUNT=$(find "$VERIFY_DIR" -type f | wc -l)
          echo "| Source file count | $SRC_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Round-trip file count | $VER_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Unpack SIMULATED to \`$VERIFY_DIR\` — source files in \`${{ env.SOLUTION_FOLDER }}\` were NOT modified."

      # ── 8. Reset build number in Solution.xml ────────────────────────────
      # Keep major.minor; reset build to 0 so CI stamps it at build time.
      # Runs in both real and mock-deploy mode (local file operation).
      - name: Reset build number in Solution.xml
        shell: bash
        run: |
          SOLUTION_XML="${{ env.SOLUTION_FOLDER }}/Other/Solution.xml"
          if [ -f "$SOLUTION_XML" ]; then
            CURRENT=$(grep -oP '(?<=<Version>)[^<]+' "$SOLUTION_XML" || echo "1.0.0.0")
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_VERSION="${MAJOR}.${MINOR}.0.0"
            sed -i "s|<Version>[^<]*</Version>|<Version>${NEW_VERSION}</Version>|" "$SOLUTION_XML"
            echo "ℹ️  Version reset: ${CURRENT} → ${NEW_VERSION} (in $SOLUTION_XML)"
            echo "| Version reset | \`${CURRENT}\` → \`${NEW_VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 9. Export configuration data ─────────────────────────────────────
      # Looks for config/<SolutionName>/data-schema.xml
      # Falls back to config/data-schema.xml for single-solution repos
      - name: Resolve config data schema — ${{ matrix.solution }}
        if: inputs.export-config-data == true
        shell: bash
        run: |
          SCHEMA=""
          if [ -f "${{ env.DATA_SCHEMA_FILE }}" ]; then
            SCHEMA="${{ env.DATA_SCHEMA_FILE }}"
          elif [ -f "config/data-schema.xml" ]; then
            SCHEMA="config/data-schema.xml"
            echo "ℹ️  Using repo-level config/data-schema.xml"
          fi

          if [ -z "$SCHEMA" ]; then
            echo "::notice::No data-schema.xml found for ${{ matrix.solution }}. Skipping config data export."
          fi
          echo "RESOLVED_SCHEMA=${SCHEMA}" >> "$GITHUB_ENV"

      # ── 9a. Run config data export — REAL ────────────────────────────────
      - name: Export configuration data — ${{ matrix.solution }}
        if: inputs.export-config-data == true && env.RESOLVED_SCHEMA != '' && inputs.mock-deploy != true
        uses: microsoft/powerplatform-actions/export-data@v1
        with:
          environment-url: ${{ vars.PP_SDBX_URL }}
          app-id:          ${{ secrets.PP_APP_ID }}
          client-secret:   ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id:       ${{ secrets.PP_TENANT_ID }}
          schema-file:     ${{ env.RESOLVED_SCHEMA }}
          data-file:       config/${{ matrix.solution }}/config-data.zip
          overwrite:       true
        continue-on-error: true

      # ── 9b. Export configuration data — SIMULATION ───────────────────────
      # Parses the schema XML to list entities that would be exported.
      # Creates a placeholder config-data.zip to simulate the output file.
      - name: "🧪 Export configuration data — Simulation (mock-deploy)"
        if: inputs.export-config-data == true && env.RESOLVED_SCHEMA != '' && inputs.mock-deploy == true
        shell: bash
        env:
          SCHEMA: ${{ env.RESOLVED_SCHEMA }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🧪 Config Data Export — Simulation" >> "$GITHUB_STEP_SUMMARY"
          echo "**Schema:** \`$SCHEMA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Entity / Table | Simulated Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os
          schema = os.environ.get("SCHEMA", "")
          try:
              tree = ET.parse(schema)
              root = tree.getroot()
              entities = root.findall(".//entity") or root.findall("entity")
              if entities:
                  for ent in entities:
                      name = ent.get("name") or ent.get("displayname") or ent.text or "unknown"
                      print(f"| \`{name}\` | 🧪 Would export records |")
              else:
                  print("| (no entities found in schema) | — |")
          except Exception as e:
              print(f"| ⚠️  Schema parse warning: {e} | — |")
          PYEOF

          mkdir -p "config/${{ matrix.solution }}"
          echo "MOCK CONFIG DATA EXPORT — simulation" > /tmp/mock-config-data.txt
          echo "Schema: $SCHEMA" >> /tmp/mock-config-data.txt
          echo "Run: ${{ github.run_number }}" >> /tmp/mock-config-data.txt
          zip -j "config/${{ matrix.solution }}/config-data.zip" /tmp/mock-config-data.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Placeholder \`config/${{ matrix.solution }}/config-data.zip\` created." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Config data export SIMULATED — no Dataverse connection used."

      # ── 10a. Commit and push — REAL ───────────────────────────────────────
      - name: Commit and push — ${{ matrix.solution }}
        id: commit
        if: inputs.mock-deploy != true
        shell: bash
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "nothing-to-commit=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::No changes detected for ${{ matrix.solution }}. Nothing to commit."
          else
            git commit -m "${{ inputs.commit-message }}: ${{ matrix.solution }} [run #${{ github.run_number }}]"
            git push origin "${{ env.BRANCH_NAME }}"
            echo "nothing-to-commit=false" >> "$GITHUB_OUTPUT"
            echo "✅ Committed and pushed ${{ matrix.solution }} to \`${{ env.BRANCH_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 10b. Commit dry-run — SIMULATION ─────────────────────────────────
      # Stages all changes and shows what would be committed, without pushing.
      - name: "🧪 Commit dry-run — Simulation (mock-deploy)"
        id: commit-sim
        if: inputs.mock-deploy == true
        shell: bash
        run: |
          git add --all

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🧪 Commit Dry-Run" >> "$GITHUB_STEP_SUMMARY"
          echo "_Changes that would be committed to \`${{ env.BRANCH_NAME }}\`:_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if git diff --cached --quiet; then
            echo "nothing-to-commit=true"  >> "$GITHUB_OUTPUT"
            echo "**No changes detected** — source already matches the existing commit." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No changes detected for ${{ matrix.solution }} — nothing would be committed."
          else
            echo "nothing-to-commit=false" >> "$GITHUB_OUTPUT"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            CHANGED=$(git diff --cached --stat | tail -1)
            echo "**Would commit:** \`${{ inputs.commit-message }}: ${{ matrix.solution }} [run #${{ github.run_number }}]\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Would push to:** \`${{ env.BRANCH_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Commit SIMULATED — $CHANGED would be committed to ${{ env.BRANCH_NAME }} in a real run."
          fi

      # ── 11. Per-solution export summary ──────────────────────────────────
      - name: Export summary — ${{ matrix.solution }}
        if: always()
        shell: bash
        run: |
          MOCK="${{ inputs.mock-deploy }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📤 Export Summary — ${{ matrix.solution }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MOCK" == "true" ]]; then
            echo "| Mode | 🧪 Simulation (mock-deploy=true) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Source env | \`${{ vars.PP_SDBX_URL || 'PP_SDBX_URL not set' }}\` (not connected) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Mode | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Source env | \`${{ vars.PP_SDBX_URL }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Branch | \`${{ env.BRANCH_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config data | ${{ inputs.export-config-data == 'true' && '✅' || '⏭️' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canvas apps | ${{ inputs.process-canvas-apps == 'true' && '✅' || '⏭️' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # JOB 2 ─ Create PR (runs once after ALL exports complete)
  # Opens a single Pull Request covering all exported solutions.
  # In mock-deploy mode: prints what the PR would look like without creating it.
  # ============================================================================
  create-pr:
    name: "🔀 Create Pull Request"
    needs: [setup, export]
    if: >
      needs.export.result == 'success' &&
      inputs.create-pr == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Create PR — REAL ───────────────────────────────────────────────────
      - name: Create Pull Request
        if: inputs.mock-deploy != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH:   ${{ needs.setup.outputs.branch-name }}
        run: |
          SOLUTION_COUNT="${{ needs.setup.outputs.solution-count }}"
          SOLUTION_LIST="${{ needs.setup.outputs.solution-list }}"

          if [ "$SOLUTION_COUNT" -eq "1" ]; then
            TITLE="🔄 Export: ${SOLUTION_LIST} (#${{ github.run_number }})"
          else
            TITLE="🔄 Export: ${SOLUTION_COUNT} solutions (#${{ github.run_number }})"
          fi

          SOL_ROWS=""
          IFS=',' read -ra SOLS <<< "$SOLUTION_LIST"
          for SOL in "${SOLS[@]}"; do
            TRIMMED="$(echo "$SOL" | xargs)"
            SOL_ROWS="${SOL_ROWS}\n- \`${TRIMMED}\`"
          done

          BODY="## Automated sandbox export

          **Solutions exported:**
          $(echo -e "$SOL_ROWS")

          **Source environment:** \`${{ vars.PP_SDBX_URL }}\`
          **Run:** #${{ github.run_number }}
          **Actor:** @${{ github.actor }}

          ---
          > Review the diff and merge to trigger the CI/CD release pipeline."

          gh pr create \
            --title  "$TITLE" \
            --body   "$BODY" \
            --head   "$BRANCH" \
            --base   "main" \
          || echo "::warning::PR may already exist for branch $BRANCH — check GitHub."

      # ── Create PR — SIMULATION ─────────────────────────────────────────────
      - name: "🧪 Create Pull Request — Simulation (mock-deploy)"
        if: inputs.mock-deploy == true
        shell: bash
        run: |
          SOLUTION_COUNT="${{ needs.setup.outputs.solution-count }}"
          SOLUTION_LIST="${{ needs.setup.outputs.solution-list }}"
          BRANCH="${{ needs.setup.outputs.branch-name }}"

          if [ "$SOLUTION_COUNT" -eq "1" ]; then
            TITLE="🔄 Export: ${SOLUTION_LIST} (#${{ github.run_number }})"
          else
            TITLE="🔄 Export: ${SOLUTION_COUNT} solutions (#${{ github.run_number }})"
          fi

          echo "## 🧪 Pull Request — Simulation" >> "$GITHUB_STEP_SUMMARY"
          echo "_mock-deploy=true — no PR was created. This is what would be raised:_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR Title | \`$TITLE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Head branch | \`$BRANCH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Solutions | $SOLUTION_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR body would be:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "## Automated sandbox export" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Solutions exported:" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra SOLS <<< "$SOLUTION_LIST"
          for SOL in "${SOLS[@]}"; do
            echo "  - $(echo $SOL | xargs)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source environment: ${{ vars.PP_SDBX_URL || 'PP_SDBX_URL not set' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Actor: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::PR creation SIMULATED — no gh pr create was called. Re-run without mock-deploy=true to create the real PR."

      - name: PR summary
        if: always()
        shell: bash
        run: |
          MOCK="${{ inputs.mock-deploy }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🔀 Pull Request" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | $([[ "$MOCK" == "true" ]] && echo "🧪 Simulated" || echo "✅ Live") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ needs.setup.outputs.branch-name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Solutions | ${{ needs.setup.outputs.solution-count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
