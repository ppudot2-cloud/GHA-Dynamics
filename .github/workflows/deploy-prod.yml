# =============================================================================
# WORKFLOW: Deploy UAT + Prod — Pipeline 2
# =============================================================================
#
# Triggered automatically when a feature/pipeline-* → main PR is MERGED.
# This is the second and final pipeline of the two-pipeline architecture:
#
#   Pipeline 1 — build-and-deploy.yml  → Dev + Intg (builds, exports, deploys non-prod)
#   Pipeline 2 — THIS WORKFLOW         → UAT (final gate) + Prod
#
# HOW IT WORKS:
#   1. Fires on pull_request closed+merged targeting main from feature/pipeline-*.
#   2. Checks out main (the merge commit) and reads pipeline-context.json.
#      This file was committed to the feature branch by Pipeline 1 and is now
#      on main after merge. It carries the run_id needed to download built
#      solution artifacts from that Pipeline 1 run.
#   3. Deploys UAT as a final validation gate before Prod.
#   4. Deploys Prod — pauses at the Prod GitHub Environment approval gate
#      (configure required reviewers in Settings → Environments → Prod).
#
# TRIGGERS:
#   pull_request (merged) — auto, feature/pipeline-* → main
#   workflow_dispatch     — manual re-run or ad-hoc promotion
#
# ROLLBACK:
#   Set enable_backup=true (workflow_dispatch only) to take a pre-import backup.
#   Backups enable rollback.yml to restore any environment.
# =============================================================================

name: Deploy UAT + Prod

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      enable_backup:
        description: >
          Take a pre-import backup at UAT and Prod (enables rollback via rollback.yml).
          Default false — skip backups for faster deployments.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "deploy-prod-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Guard — only proceed when:
  #   • PR trigger: PR was merged (not just closed) + from feature/pipeline-*
  #   • Dispatch trigger: always proceed
  # ============================================================================
  guard:
    name: "🛡️ Verify trigger"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'feature/pipeline-'))
    steps:
      - name: Confirm trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "✅ PR merged: ${{ github.event.pull_request.head.ref }} → main"
            echo "   PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "   Merged by: @${{ github.actor }}"
          else
            echo "✅ Triggered manually by: @${{ github.actor }}"
          fi

  # ============================================================================
  # Read pipeline-context.json from main (the merge commit).
  # The file was written by Pipeline 1 on the feature branch and landed on
  # main when the PR was merged. It carries the run_id needed to download
  # the built solution artifacts from the original Pipeline 1 run.
  # ============================================================================
  read-context:
    name: "📖 Read pipeline context"
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      run_id:        ${{ steps.ctx.outputs.run_id }}
      run_number:    ${{ steps.ctx.outputs.run_number }}
      run_attempt:   ${{ steps.ctx.outputs.run_attempt }}
      matrix:        ${{ steps.ctx.outputs.matrix }}
      solution_list: ${{ steps.ctx.outputs.solution_list }}

    steps:
      - name: Checkout main (merge commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse pipeline-context.json
        id: ctx
        shell: pwsh
        run: |
          $ctxFile = 'pipeline-context.json'
          if (-not (Test-Path $ctxFile)) {
            Write-Error "::error::pipeline-context.json not found on main."
            Write-Error "::error::Ensure Pipeline 1 (build-and-deploy.yml) completed and the feature branch was merged."
            exit 1
          }

          $ctx = Get-Content $ctxFile | ConvertFrom-Json
          Write-Host "Pipeline context loaded:"
          Write-Host "  runId        : $($ctx.runId)"
          Write-Host "  runNumber    : $($ctx.runNumber)"
          Write-Host "  runAttempt   : $($ctx.runAttempt)"
          Write-Host "  solutions    : $($ctx.solutionList)"
          Write-Host "  featureBranch: $($ctx.featureBranch)"
          Write-Host "  triggeredBy  : $($ctx.triggeredBy)"

          "run_id=$($ctx.runId)"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_number=$($ctx.runNumber)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_attempt=$($ctx.runAttempt)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "matrix=$($ctx.matrix)"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "solution_list=$($ctx.solutionList)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # ============================================================================
  # Deploy UAT → Prod
  # UAT is re-deployed as a final validation gate before Prod.
  # Prod gate pauses until a reviewer approves in Settings → Environments → Prod.
  # Artifacts are downloaded from Pipeline 1 run via source_run_id.
  # ============================================================================
  stage-deploy:
    name: "🚀 Deploy UAT → Prod"
    needs: [read-context]
    permissions:
      id-token: write
      contents: read
      actions: read    # required: cross-run artifact download (source_run_id = Pipeline 1 run_id)
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-deploy-chain.yml@main
    with:
      matrix:          ${{ needs.read-context.outputs.matrix }}
      environments:    'UAT,Prod'
      source_run_id:   ${{ needs.read-context.outputs.run_id }}
      run_number:      ${{ needs.read-context.outputs.run_number }}
      run_attempt:     ${{ needs.read-context.outputs.run_attempt }}
      mock_deploy:     false
      base_solutions:  ${{ vars.PP_BASE_SOLUTIONS || '' }}
      jfrog_url:       ${{ vars.JFROG_URL || '' }}
      jfrog_repo:      ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}

      # Dev/Intg/FRS/Perf configs are required inputs but filtered out by
      # environments:'UAT,Prod' — they will never be deployed here.
      dev_config: >-
        {"name":"Dev","url":"${{ vars.PP_DEV_URL }}","previous_url":"",
        "solution_type":"Unmanaged","enable_backup":false,
        "enable_blocking_check":false,"enable_version_compare":false,
        "import_config_data":false}

      intg_config: >-
        {"name":"Intg","url":"${{ vars.PP_INTG_URL }}","previous_url":"${{ vars.PP_DEV_URL }}",
        "solution_type":"Managed","enable_backup":false,
        "enable_blocking_check":true,"enable_version_compare":false,
        "import_config_data":false}

      uat_config: >-
        {"name":"UAT","url":"${{ vars.PP_UAT_URL }}","previous_url":"${{ vars.PP_INTG_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      frs_config: >-
        {"name":"FRS","url":"${{ vars.PP_FRS_URL }}","previous_url":"${{ vars.PP_UAT_URL }}",
        "solution_type":"Managed","enable_backup":false,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      perf_config: >-
        {"name":"Perf","url":"${{ vars.PP_PERF_URL }}","previous_url":"${{ vars.PP_FRS_URL }}",
        "solution_type":"Managed","enable_backup":false,
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      prod_config: >-
        {"name":"Prod","url":"${{ vars.PP_PROD_URL }}","previous_url":"${{ vars.PP_PERF_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":true}

    secrets: inherit

  # ============================================================================
  # Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline 2 Summary"
    needs: [read-context, stage-deploy]
    if: always() && needs.read-context.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          RESULT="${{ needs.stage-deploy.result }}"
          ICON="✅"
          if [ "$RESULT" != "success" ]; then ICON="❌"; fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Pipeline 2 — UAT + Prod Deployment Summary

          | Field | Value |
          | --- | --- |
          | Pipeline 1 run | #${{ needs.read-context.outputs.run_number }} |
          | Solutions | ${{ needs.read-context.outputs.solution_list }} |
          | UAT + Prod deploy | $ICON $RESULT |
          | Triggered by | @${{ github.actor }} |
          EOF

      - name: Send failure notification
        if: needs.stage-deploy.result == 'failure'
        continue-on-error: true   # mail secrets optional — don't fail the job if not configured
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ppudot1@gmail.com
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject:        "❌ UAT/Prod Deployment FAILED (Pipeline 2) — ${{ github.repository }} run #${{ needs.read-context.outputs.run_number }}"
          body: |
            ⚠️ Pipeline 2 (UAT + Prod) deployment failed.

            Repository   : ${{ github.repository }}
            Pipeline 1 run: #${{ needs.read-context.outputs.run_number }}
            Solutions    : ${{ needs.read-context.outputs.solution_list }}
            Deploy result: ${{ needs.stage-deploy.result }}
            Triggered by : @${{ github.actor }}

            Rollback: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/rollback.yml

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
