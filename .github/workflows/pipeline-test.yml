# =============================================================================
# WORKFLOW: Pipeline Integration Test (Full Mock Run)
# =============================================================================
# Trigger  : PR to main, push to main, or manual dispatch
# Purpose  : Verifies the complete pipeline flow end-to-end in mock mode.
#            No Dataverse changes, no Azure login, no JFrog upload.
#
# Architecture note:
#   build-and-deploy.yml is a *caller* workflow (workflow_dispatch + push),
#   not a reusable workflow. This test workflow therefore:
#     1. Runs Pester unit tests directly
#     2. Calls the GHA-Core reusable _stage-build.yml (which HAS workflow_call)
#     3. Runs a mock Dev deploy job calling deploy-all-solutions directly,
#        mirroring how build-and-deploy.yml wires the composite action.
#   This validates the entire build-and-deploy critical path without needing
#   a reusable wrapper around the caller.
#
# What it validates:
#   ✅ solutions.json resolves correctly (Resolve-SolutionMatrix)
#   ✅ GHA-Core _stage-build.yml can be called with current inputs
#   ✅ Mock build: version stamp, pack, solution checker simulation
#   ✅ Mock deploy: deploy-all-solutions composite action runs end-to-end
#   ✅ Post-deploy verification step runs in mock mode
#   ✅ All PowerShell scripts (unit tests) pass via Pester
#
# Cost: zero — no real Azure or Dataverse resources consumed.
# =============================================================================

name: Pipeline Integration Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'solutions.json'
      - 'deployment-settings/**'
      - 'src/solutions/**'

  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'solutions.json'

  workflow_dispatch:
    inputs:
      solutions:
        description: 'Solutions to test ("all" or comma-separated)'
        required: false
        default: 'all'

jobs:
  # ============================================================================
  # JOB 0 — Setup (resolve solution matrix)
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    outputs:
      matrix:         ${{ steps.resolve.outputs.matrix }}
      solution_list:  ${{ steps.resolve.outputs.solution_list }}
      solution_count: ${{ steps.resolve.outputs.solution_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref:        main
          path:       .ci
          token:      ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

  # ============================================================================
  # JOB 1 — Pester Unit Tests (parallel with build)
  # ============================================================================
  pester-unit-tests:
    name: "🧪 Pester Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core (for test files and scripts)
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref:        main
          path:       .ci
          token:      ${{ secrets.GHA_CORE_PAT }}

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
          Import-Module Pester
          Write-Host "Pester version: $((Get-Module Pester).Version)"

      - name: Run Pester — Dynamics scripts
        shell: pwsh
        run: |
          $testDir = '.ci/.github/servicenow/Tests/Unit/Dynamics'
          if (-not (Test-Path $testDir)) {
            Write-Host "::warning::No Dynamics Pester tests found at $testDir — skipping."
            exit 0
          }

          $config = New-PesterConfiguration
          $config.Run.Path            = $testDir
          $config.Output.Verbosity    = 'Detailed'
          $config.TestResult.Enabled  = $true
          $config.TestResult.OutputPath   = 'test-results-dynamics.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) Pester test(s) failed."
            exit 1
          }
          Write-Host "✅ All $($result.PassedCount) Pester test(s) passed."

      - name: Upload Pester test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-run${{ github.run_number }}
          path: test-results-*.xml
          retention-days: 30

  # ============================================================================
  # JOB 2 — Mock Build Stage (calls the GHA-Core reusable _stage-build.yml)
  # _stage-build.yml has `on: workflow_call:` and IS a valid reusable workflow.
  # ============================================================================
  mock-build:
    name: "🔨 Mock Build Stage"
    needs: setup
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:      ${{ needs.setup.outputs.matrix }}
      mock_deploy: true
      # azure_* intentionally left blank — reveille skips login in mock mode
      azure_client_id:       ''
      azure_tenant_id:       ''
      azure_subscription_id: ''
      azure_key_vault_name:  ''
    secrets: inherit

  # ============================================================================
  # JOB 3 — Mock Deploy (Dev environment only)
  # Mirrors build-and-deploy.yml's deploy-dev job exactly.
  # Calls the deploy-all-solutions composite action directly (same pattern as
  # the real pipeline). Validates the composite action wiring end-to-end.
  # ============================================================================
  mock-deploy-dev:
    name: "🚀 Mock Deploy | Dev"
    needs: [setup, mock-build]
    if: needs.mock-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}

    steps:
      - name: Reveille (mock — skips Azure login and AKV fetch)
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy: 'true'

      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main

      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy all solutions → Dev (mock)
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Dev
          environment_url:          ${{ vars.PP_DEV_URL || 'https://mock-dev.crm.dynamics.com' }}
          solution_type:            Unmanaged
          enable_backup:            false
          enable_blocking_check:    false
          enable_version_compare:   false
          import_config_data:       false
          previous_environment_url: ''
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              true
          base_solutions:           ''
          jfrog_url:                ''
          jfrog_repo:               'powerplatform-solutions'
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        false
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  # ============================================================================
  # JOB 4 — Summary
  # ============================================================================
  test-summary:
    name: "📋 Test Summary"
    needs: [pester-unit-tests, mock-build, mock-deploy-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write test summary
        shell: pwsh
        run: |
          $pester  = '${{ needs.pester-unit-tests.result }}'
          $build   = '${{ needs.mock-build.result }}'
          $deploy  = '${{ needs.mock-deploy-dev.result }}'

          $pass      = @('success', 'skipped')
          $allPassed = ($pass -contains $pester) -and ($pass -contains $build) -and ($pass -contains $deploy)

          @"
          ## 🧪 Pipeline Integration Test — Run #${{ github.run_number }}

          | Check | Result |
          |---|---|
          | Pester unit tests | $pester |
          | Mock build stage (_stage-build.yml) | $build |
          | Mock deploy — Dev (deploy-all-solutions) | $deploy |

          **Overall: $(if ($allPassed) { '✅ PASSED' } else { '❌ FAILED' })**

          > Full 6-environment deploy is validated by the real `build-and-deploy.yml`
          > pipeline runs with `mock_deploy=true` (dispatch from UI).
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if (-not $allPassed) { exit 1 }
