# =============================================================================
# WORKFLOW: Branch Protection Enforcement
# =============================================================================
# Trigger  : Push to main, PR to main, or weekly schedule
# Purpose  : Enforces and audits that branch protection rules are correctly
#            configured on main — the gate that controls Pipeline 2 (prod deploy).
#
# Checks performed:
#   1. 'main' branch requires PR before merging
#   2. 'main' requires status checks to pass
#   3. All 6 GitHub Environments (Dev/Intg/UAT/FRS/Perf/Prod) exist
#   4. Prod environment has at least one required reviewer configured
#   5. Alerts (via workflow annotation) if any check fails
#
# This workflow is informational — it annotates and reports but does NOT block
# commits. Use GitHub's native branch protection UI for hard enforcement.
# =============================================================================

name: Branch Protection Audit

on:
  schedule:
    # Run every Monday at 07:00 UTC — catch accidental rule removals early
    - cron: '0 7 * * 1'

  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-protection.yml'

  workflow_dispatch:
    inputs:
      fail_on_violation:
        description: 'Fail the workflow if a protection rule is missing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit-branch-protection:
    name: "🔒 Branch Protection Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit branch protection rules
        id: audit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_ON_VIOLATION: ${{ inputs.fail_on_violation || 'false' }}
        run: |
          $repo          = '${{ github.repository }}'
          $failOnViolate = $env:FAIL_ON_VIOLATION -eq 'true'
          $violations    = @()
          $warnings      = @()

          Write-Host "🔍 Auditing branch protection for: $repo"
          Write-Host ""

          # ── 1. Check main branch protection ──────────────────────────────
          Write-Host "── Branch: main ─────────────────────────────────────────"
          try {
            $branchInfo = gh api "repos/$repo/branches/main" --jq '.' 2>&1 | ConvertFrom-Json
            $protection = $branchInfo.protection

            if ($protection.enabled -eq $true -or $branchInfo.protected -eq $true) {
              Write-Host "  ✅ Branch protection: enabled"
            } else {
              Write-Host "  ❌ Branch protection: NOT enabled on main"
              $violations += "main has no branch protection rules"
            }

            # Require PR check
            $prRequired = $branchInfo.protection_url -ne $null
            if ($prRequired) {
              # Get detailed protection settings
              try {
                $details = gh api "repos/$repo/branches/main/protection" --jq '.' 2>&1 | ConvertFrom-Json
                if ($details.required_pull_request_reviews) {
                  Write-Host "  ✅ Requires pull request: yes (min $($details.required_pull_request_reviews.required_approving_review_count) reviewer(s))"
                } else {
                  Write-Host "  ⚠️  Required pull request reviews: not configured"
                  $warnings += "main: required_pull_request_reviews not set"
                }
                if ($details.required_status_checks.strict -eq $true) {
                  Write-Host "  ✅ Requires up-to-date branch: yes"
                } else {
                  Write-Host "  ⚠️  Branch required to be up-to-date: not enforced"
                  $warnings += "main: require_up_to_date_before_merge not set"
                }
                if ($details.enforce_admins.enabled -eq $true) {
                  Write-Host "  ✅ Enforce on admins: yes"
                } else {
                  Write-Host "  ⚠️  Protection not enforced for admins"
                  $warnings += "main: enforce_admins not enabled"
                }
              } catch {
                Write-Host "  ⚠️  Could not read detailed protection settings (may require admin token)"
                $warnings += "Could not verify detailed protection settings — check with admin token"
              }
            } else {
              Write-Host "  ❌ No protection rules found on main"
              $violations += "main: no branch protection rules configured"
            }
          } catch {
            Write-Host "  ⚠️  Could not read branch protection (requires admin scope) — skipping"
            $warnings += "Branch protection audit requires admin token — configure ADMIN_TOKEN secret for full audit"
          }

          # ── 2. Check GitHub Environments exist ───────────────────────────
          Write-Host ""
          Write-Host "── GitHub Environments ──────────────────────────────────"
          $requiredEnvs  = @('Dev', 'Intg', 'UAT', 'FRS', 'Perf', 'Prod')
          $missingEnvs   = @()

          try {
            $envList = gh api "repos/$repo/environments" --jq '.environments[].name' 2>&1
            foreach ($env in $requiredEnvs) {
              if ($envList -contains $env) {
                Write-Host "  ✅ Environment: $env"
              } else {
                Write-Host "  ❌ Environment: $env — MISSING"
                $missingEnvs += $env
                $violations  += "Environment '$env' is not configured"
              }
            }
          } catch {
            Write-Host "  ⚠️  Could not list environments — skipping environment audit"
            $warnings += "Environment audit failed — verify GHA_CORE_PAT has repo scope"
          }

          # ── 3. Check Prod has required reviewers ──────────────────────────
          Write-Host ""
          Write-Host "── Prod Environment Reviewers ───────────────────────────"
          try {
            $prodEnv   = gh api "repos/$repo/environments/Prod" --jq '.' 2>&1 | ConvertFrom-Json
            $reviewers = $prodEnv.protection_rules |
                         Where-Object { $_.type -eq 'required_reviewers' }

            if ($reviewers -and $reviewers.reviewers.Count -gt 0) {
              Write-Host "  ✅ Prod has $($reviewers.reviewers.Count) required reviewer(s)"
            } else {
              Write-Host "  ❌ Prod environment has NO required reviewers — anyone can trigger a prod deploy"
              $violations += "Prod environment: no required reviewers configured"
            }
          } catch {
            Write-Host "  ⚠️  Could not read Prod environment reviewers — skipping"
            $warnings += "Could not verify Prod reviewers — check environment configuration manually"
          }

          # ── 4. Summary ────────────────────────────────────────────────────
          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "  Violations : $($violations.Count)"
          Write-Host "  Warnings   : $($warnings.Count)"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── Step summary ─────────────────────────────────────────────────
          $violationTable = if ($violations.Count -gt 0) {
            ($violations | ForEach-Object { "| ❌ | $_ |" }) -join "`n"
          } else { "| ✅ | All checks passed |" }

          $warningTable = if ($warnings.Count -gt 0) {
            ($warnings | ForEach-Object { "| ⚠️ | $_ |" }) -join "`n"
          } else { "| ✅ | No warnings |" }

          @"
          ## 🔒 Branch Protection Audit — $repo

          ### Violations
          | Status | Finding |
          |---|---|
          $violationTable

          ### Warnings
          | Status | Finding |
          |---|---|
          $warningTable

          > Run with `fail_on_violation=true` (workflow_dispatch) to make violations block the workflow.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          # ── Output for downstream steps ───────────────────────────────────
          "violation_count=$($violations.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "warning_count=$($warnings.Count)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Fail if requested
          if ($failOnViolate -and $violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Host "::error::Branch protection violation: $_" }
            exit 1
          }
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Host "::warning::Branch protection violation: $_" }
          }

      - name: Create GitHub Issue on violation (scheduled runs only)
        if: github.event_name == 'schedule' && steps.audit.outputs.violation_count != '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $violCount = '${{ steps.audit.outputs.violation_count }}'
          $runUrl    = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $existing = gh issue list --label "branch-protection" --state open --json number --jq '.[0].number' 2>&1
          if ($existing -and $existing -match '^\d+$') {
            Write-Host "ℹ️  Existing branch-protection issue #$existing — adding comment"
            gh issue comment $existing --body "⚠️ Branch protection violations still present ($violCount). See run: $runUrl"
          } else {
            Write-Host "🚨 Creating new branch-protection issue"
            gh issue create `
              --title "🔒 Branch protection violations detected" `
              --body "Automated audit found **$violCount** violation(s) on $(Get-Date -Format 'yyyy-MM-dd').`n`nSee details: $runUrl" `
              --label "branch-protection,security" `
              2>&1 | Write-Host
          }
