# =============================================================================
# WORKFLOW: Solution Rollback
# =============================================================================
# Trigger  : Manual (workflow_dispatch)
# Delegates: All logic lives in GHA-Core/_reusable-rollback.yml.
#
# This file is intentionally thin — it exists only to:
#   1. Expose the workflow_dispatch UI with typed inputs (including type: choice,
#      which is only valid on workflow_dispatch — not workflow_call)
#   2. Read repository variables (vars.*) which cannot cross repo boundaries
#   3. Forward everything to the reusable workflow in GHA-Core
#
# To change rollback logic, edit:
#   GHA-Core/.github/workflows/_reusable-rollback.yml
# =============================================================================

name: Rollback Solution

on:
  workflow_dispatch:
    inputs:
      target-environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - Dev
          - Intg
          - UAT
          - Perf
          - Prod

      solution-name:
        description: "Name of the solution to roll back (e.g. CoreSolution)"
        required: true
        type: string

      run-number:
        description: >
          Run number of the deployment to roll back FROM.
          Find it in the Actions tab — e.g. 42 restores backup-{solution}-{env}-v42.
        required: true
        type: string

      deployment-settings-file:
        description: "Optional: relative path to deployment-settings.json for this environment"
        required: false
        default: ""
        type: string

      confirm-rollback:
        description: "Type CONFIRM to proceed (safeguard against accidental rollback)"
        required: true
        default: ""
        type: string

jobs:
  rollback:
    name: "Rollback Solution"
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_reusable-rollback.yml@main
    with:
      # ── User inputs ────────────────────────────────────────────────────────
      target-environment:       ${{ inputs.target-environment }}
      solution-name:            ${{ inputs.solution-name }}
      run-number:               ${{ inputs.run-number }}
      deployment-settings-file: ${{ inputs.deployment-settings-file || '' }}
      confirm-rollback:         ${{ inputs.confirm-rollback }}
      # ── Repository variables (read here — not accessible inside GHA-Core) ──
      pp-dev-url:               ${{ vars.PP_DEV_URL }}
      pp-intg-url:              ${{ vars.PP_INTG_URL }}
      pp-uat-url:               ${{ vars.PP_UAT_URL }}
      pp-perf-url:              ${{ vars.PP_PERF_URL }}
      pp-prod-url:              ${{ vars.PP_PROD_URL }}
    secrets: inherit
