            -EnvironmentName "Perf" `
            -SolutionsJson  (Get-Content solutions.json -Raw) `
            -MockDeploy     $${{ inputs.mock_deploy == true }}

  rollback-prod:
    name: Rollback → Prod
    if: inputs.environment == 'Prod'
    needs: validate
    runs-on: ubuntu-latest
    environment: Prod
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille — checkout, OIDC login, AKV secrets, merge vars
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}

      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main

      - name: Download backup artifact
        uses: actions/download-artifact@v4
        with:
          name:    ${{ inputs.backup_artifact_name }}
          path:    backup/
          run-id:  ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GHA_CORE_PAT }}

      - name: Rollback solutions → Prod
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Invoke-Rollback.ps1 `
            -BackupDir      "backup" `
            -EnvironmentUrl "${{ vars.PP_PROD_URL }}" `
            -EnvironmentName "Prod" `
            -SolutionsJson  (Get-Content solutions.json -Raw) `
            -MockDeploy     $${{ inputs.mock_deploy == true }}

  # ── Rollback summary (always runs) ──────────────────────────────────────────
  rollback-summary:
    name: Rollback Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - rollback-dev
      - rollback-intg
      - rollback-uat
      - rollback-frs
      - rollback-perf
      - rollback-prod
    steps:
      - name: Write rollback summary
        shell: pwsh
        run: |
          $env   = '${{ inputs.environment }}'
          $runId = '${{ inputs.source_run_id }}'
          $art   = '${{ inputs.backup_artifact_name }}'
          $actor = '${{ github.actor }}'
          $ts    = (Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')

          $jobs = @{
            validate      = '${{ needs.validate.result }}'
            'rollback-dev'   = '${{ needs.rollback-dev.result }}'
            'rollback-intg'  = '${{ needs.rollback-intg.result }}'
            'rollback-uat'   = '${{ needs.rollback-uat.result }}'
            'rollback-frs'   = '${{ needs.rollback-frs.result }}'
            'rollback-perf'  = '${{ needs.rollback-perf.result }}'
            'rollback-prod'  = '${{ needs.rollback-prod.result }}'
          }
          $activeResult = $jobs["rollback-$($env.ToLower())"]
          $icon = if ($activeResult -eq 'success') { '✅' } elseif ($activeResult -eq 'skipped') { '⏭️' } else { '❌' }

          $summary = @"
          ## $icon Rollback — $env

          | Field | Value |
          |---|---|
          | Environment | **$env** |
          | Source Run ID | $runId |
          | Backup Artifact | $art |
          | Triggered By | $actor |
          | Completed At | $ts |
          | Result | **$($activeResult.ToUpper())** |
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
