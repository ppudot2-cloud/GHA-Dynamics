# =============================================================================
# WORKFLOW: Full Release Pipeline — Dev → Intg → UAT → Perf → Prod
# =============================================================================
#
# ┌─ SCENARIO SUPPORT ──────────────────────────────────────────────────────┐
# │  Single-solution repo : place one directory under src/solutions/, OR    │
# │                         set the PP_SOLUTION_NAME repo variable.         │
# │                         Leave `solutions` input as "all".               │
# │                                                                          │
# │  Multi-solution repo  : place each solution under src/solutions/<name>. │
# │                         Use `solutions` input to pick what deploys:     │
# │                           "all"                → every solution         │
# │                           "CoreSolution"       → one solution           │
# │                           "CoreSolution, ExtA" → explicit subset        │
# └─────────────────────────────────────────────────────────────────────────┘
#
# PIPELINE FLOW:
#   setup
#     └─► build (PARALLEL per solution)
#           └─► jfrog-upload (PARALLEL per solution) ← uploads ZIPs to Artifactory
#                 └─► deploy-dev (SEQUENTIAL, max-parallel:1)
#                       └─► gate-intg
#                             └─► deploy-intg (SEQUENTIAL)
#                                   └─► gate-uat → deploy-uat
#                                         └─► gate-perf → deploy-perf
#                                               └─► gate-prod → deploy-prod
#   pipeline-summary (always)
#
# DEPLOY ORDERING:
#   Default: alphabetical. Custom order: create .github/solutions-config.json.
#
# SEQUENTIAL DEPLOYMENT:
#   max-parallel: 1 in all deploy jobs — Power Platform platform constraint.
#   Dataverse cannot process parallel solution imports without async conflicts.
#
# MANDATORY (non-mock runs):
#   enable_jfrog_upload  must be true
# Solution Checker always runs — there is no toggle.
# =============================================================================

name: Release Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/solutions/**'
      - 'config/**'

  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Solutions to build and deploy.
          "all" = every solution in src/solutions/ (default).
          Comma-separated for a subset: "CoreSolution" or "CoreSolution, ExtA, ExtB".
        required: false
        default: 'all'

      target_environments:
        description: 'Which environments to deploy to'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - dev-intg
          - dev-intg-uat

      enable_backup:
        description: 'Backup each environment before deploying (rollback point)'
        required: false
        default: true
        type: boolean

      enable_blocking_check:
        description: 'Abort if environment has in-progress async operations'
        required: false
        default: true
        type: boolean

      enable_version_compare:
        description: 'Compare solution version vs previous environment before deploying'
        required: false
        default: true
        type: boolean

      mock_deploy:
        description: 'Dry run — run all checks but skip actual solution imports and Artifactory uploads'
        required: false
        default: false
        type: boolean

      trigger_upgrade:
        description: 'Use holding-solution upgrade pattern vs in-place update'
        required: false
        default: false
        type: boolean

      import_config_data:
        description: 'Import configuration migration data after each solution import'
        required: false
        default: false
        type: boolean

      enable_jfrog_upload:
        description: 'Upload built solution ZIPs to JFrog Artifactory. Mandatory for non-mock runs.'
        required: false
        default: true
        type: boolean

      checker_error_level:
        description: 'Minimum severity that fails Solution Checker'
        required: false
        default: 'HighIssue'
        type: choice
        options:
          - CriticalIssue
          - HighIssue
          - MediumIssue
          - LowIssue
          - InformationalIssue

concurrency:
  group: "release-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 0 ─ Setup
  # Discovers solutions, validates the selection, applies ordering, and outputs
  # the JSON matrix that every downstream job uses to fan out per solution.
  # ============================================================================
  setup:
    name: "🔍 Resolve Solutions"
    runs-on: ubuntu-latest
    outputs:
      matrix:          ${{ steps.resolve.outputs.matrix }}
      solution_list:   ${{ steps.resolve.outputs.solution_list }}
      solution_count:  ${{ steps.resolve.outputs.solution_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve solution list
        id: resolve
        shell: pwsh
        run: |
          & .github/scripts/Resolve-SolutionMatrix.ps1 `
            -InputSolutions '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName '${{ vars.PP_SOLUTION_NAME }}'

  # ============================================================================
  # JOB 1 ─ Build (runs in PARALLEL — one job per solution simultaneously)
  # Pack managed + unmanaged ZIPs, stamp version, run Solution Checker.
  # ============================================================================
  build:
    name: "🏗️ Build | ${{ matrix.solution }}"
    needs: setup
    if: needs.setup.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/_reusable-build.yml
    with:
      solution_name:            ${{ matrix.solution }}
      solution_source_folder:   src/solutions/${{ matrix.solution }}
      checker_geo:              ${{ vars.PP_CHECKER_GEO || 'UnitedStates' }}
      checker_error_level:      ${{ inputs.checker_error_level || 'HighIssue' }}
      build_version_strategy:   run_number
      data_schema_file:         ${{ vars.PP_DATA_SCHEMA_FILE || '' }}
      source_environment_url:   ${{ vars.PP_SDBX_URL || '' }}
      mock_deploy:              ${{ inputs.mock_deploy == true }}
      enable_jfrog_upload:      ${{ inputs.enable_jfrog_upload != false }}
      jfrog_url:                ${{ vars.JFROG_URL || '' }}
      jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
    secrets: inherit

  # ============================================================================
  # JOB 1b ─ JFrog Upload (PARALLEL per solution, after build)
  # Uploads managed + unmanaged ZIPs to Artifactory.
  # Path: {jfrog_repo}/{repo_name}/{solution}/{run_number}/{run_attempt}/
  # Skipped when enable_jfrog_upload=false or mock_deploy=true.
  # ============================================================================
  jfrog-upload:
    name: "📦 JFrog Upload | ${{ matrix.solution }}"
    needs: [setup, build]
    if: >
      needs.build.result == 'success' &&
      inputs.enable_jfrog_upload != false
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/_reusable-jfrog.yml
    with:
      action:              upload
      solution_name:       ${{ matrix.solution }}
      jfrog_url:           ${{ vars.JFROG_URL || '' }}
      jfrog_repo:          ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      artifact_local_path: out/${{ matrix.solution }}
      mock_deploy:         ${{ inputs.mock_deploy == true }}
    secrets: inherit

  # ============================================================================
  # JOB 2 ─ Deploy to Dev (Unmanaged) — SEQUENTIAL
  # max-parallel: 1  ← Power Platform platform constraint, not solution dependency
  # ============================================================================
  deploy-dev:
    name: "🚀 Dev [Unmanaged] | ${{ matrix.solution }}"
    needs: [setup, build, jfrog-upload]
    if: >
      (needs.build.result == 'success') &&
      (needs.jfrog-upload.result == 'success' || needs.jfrog-upload.result == 'skipped') &&
      (inputs.target_environments == 'all'          ||
       inputs.target_environments == 'dev'          ||
       inputs.target_environments == 'dev-intg'     ||
       inputs.target_environments == 'dev-intg-uat' ||
       github.event_name == 'pull_request')
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment_name:                  Dev
      environment_url:                   ${{ vars.PP_DEV_URL }}
      solution_name:                     ${{ matrix.solution }}
      solution_type:                     unmanaged
      artifact_name:                     solution-${{ matrix.solution }}-${{ github.run_number }}
      solution_version:                  ${{ needs.build.outputs.solution_version }}
      enable_backup:                     ${{ inputs.enable_backup != false }}
      enable_blocking_check:             ${{ inputs.enable_blocking_check != false }}
      enable_version_compare:            false
      mock_deploy:                       ${{ inputs.mock_deploy == true }}
      trigger_upgrade:                   false
      overwrite_unmanaged_customizations: true
      import_config_data:                ${{ inputs.import_config_data == true }}
      deployment_settings_file:          deployment-settings/dev/${{ matrix.solution }}.json
      jfrog_url:                         ${{ vars.JFROG_URL || '' }}
      jfrog_repo:                        ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      build_run_number:                  ${{ github.run_number }}
      build_run_attempt:                 ${{ github.run_attempt }}
    secrets: inherit

  # ============================================================================
  # GATE ─ Intg
  # ONE approval here covers ALL solutions deploying to Intg.
  # Set required reviewers: Settings → Environments → Intg.
  # ============================================================================
  gate-intg:
    name: "🔐 Gate | Intg"
    needs: [setup, deploy-dev]
    if: >
      needs.deploy-dev.result == 'success' &&
      (inputs.target_environments == 'all'          ||
       inputs.target_environments == 'dev-intg'     ||
       inputs.target_environments == 'dev-intg-uat' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    environment: Intg
    steps:
      - name: Gate approved
        shell: pwsh
        run: |
          Write-Host "✅ Intg gate approved for run #${{ github.run_number }}"
          Write-Host "Solutions about to deploy: ${{ needs.setup.outputs.solution_list }}"

  # ============================================================================
  # JOB 3 ─ Deploy to Intg (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-intg:
    name: "🚀 Intg [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-intg]
    if: needs.gate-intg.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment_name:                  Intg
      environment_url:                   ${{ vars.PP_INTG_URL }}
      solution_name:                     ${{ matrix.solution }}
      solution_type:                     managed
      artifact_name:                     solution-${{ matrix.solution }}-${{ github.run_number }}
      solution_version:                  ${{ needs.build.outputs.solution_version }}
      enable_backup:                     ${{ inputs.enable_backup != false }}
      enable_blocking_check:             ${{ inputs.enable_blocking_check != false }}
      enable_version_compare:            ${{ inputs.enable_version_compare != false }}
      previous_environment_url:          ${{ vars.PP_DEV_URL }}
      mock_deploy:                       ${{ inputs.mock_deploy == true }}
      trigger_upgrade:                   ${{ inputs.trigger_upgrade == true }}
      overwrite_unmanaged_customizations: true
      import_config_data:                ${{ inputs.import_config_data == true }}
      deployment_settings_file:          deployment-settings/intg/${{ matrix.solution }}.json
      jfrog_url:                         ${{ vars.JFROG_URL || '' }}
      jfrog_repo:                        ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      build_run_number:                  ${{ github.run_number }}
      build_run_attempt:                 ${{ github.run_attempt }}
    secrets: inherit

  # ============================================================================
  # GATE ─ UAT
  # ============================================================================
  gate-uat:
    name: "🔐 Gate | UAT"
    needs: [setup, deploy-intg]
    if: >
      needs.deploy-intg.result == 'success' &&
      (inputs.target_environments == 'all'          ||
       inputs.target_environments == 'dev-intg-uat' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - name: Gate approved
        shell: pwsh
        run: |
          Write-Host "✅ UAT gate approved for run #${{ github.run_number }}"
          Write-Host "Solutions about to deploy: ${{ needs.setup.outputs.solution_list }}"

  # ============================================================================
  # JOB 4 ─ Deploy to UAT (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-uat:
    name: "🚀 UAT [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-uat]
    if: needs.gate-uat.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment_name:                  UAT
      environment_url:                   ${{ vars.PP_UAT_URL }}
      solution_name:                     ${{ matrix.solution }}
      solution_type:                     managed
      artifact_name:                     solution-${{ matrix.solution }}-${{ github.run_number }}
      solution_version:                  ${{ needs.build.outputs.solution_version }}
      enable_backup:                     ${{ inputs.enable_backup != false }}
      enable_blocking_check:             ${{ inputs.enable_blocking_check != false }}
      enable_version_compare:            ${{ inputs.enable_version_compare != false }}
      previous_environment_url:          ${{ vars.PP_INTG_URL }}
      mock_deploy:                       ${{ inputs.mock_deploy == true }}
      trigger_upgrade:                   ${{ inputs.trigger_upgrade == true }}
      overwrite_unmanaged_customizations: false
      import_config_data:                ${{ inputs.import_config_data == true }}
      deployment_settings_file:          deployment-settings/uat/${{ matrix.solution }}.json
      jfrog_url:                         ${{ vars.JFROG_URL || '' }}
      jfrog_repo:                        ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      build_run_number:                  ${{ github.run_number }}
      build_run_attempt:                 ${{ github.run_attempt }}
    secrets: inherit

  # ============================================================================
  # GATE ─ Perf
  # ============================================================================
  gate-perf:
    name: "🔐 Gate | Perf"
    needs: [setup, deploy-uat]
    if: >
      needs.deploy-uat.result == 'success' &&
      inputs.target_environments == 'all'
    runs-on: ubuntu-latest
    environment: Perf
    steps:
      - name: Gate approved
        shell: pwsh
        run: |
          Write-Host "✅ Perf gate approved for run #${{ github.run_number }}"
          Write-Host "Solutions about to deploy: ${{ needs.setup.outputs.solution_list }}"

  # ============================================================================
  # JOB 5 ─ Deploy to Perf (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-perf:
    name: "🚀 Perf [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-perf]
    if: needs.gate-perf.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment_name:                  Perf
      environment_url:                   ${{ vars.PP_PERF_URL }}
      solution_name:                     ${{ matrix.solution }}
      solution_type:                     managed
      artifact_name:                     solution-${{ matrix.solution }}-${{ github.run_number }}
      solution_version:                  ${{ needs.build.outputs.solution_version }}
      enable_backup:                     ${{ inputs.enable_backup != false }}
      enable_blocking_check:             ${{ inputs.enable_blocking_check != false }}
      enable_version_compare:            ${{ inputs.enable_version_compare != false }}
      previous_environment_url:          ${{ vars.PP_UAT_URL }}
      mock_deploy:                       ${{ inputs.mock_deploy == true }}
      trigger_upgrade:                   ${{ inputs.trigger_upgrade == true }}
      overwrite_unmanaged_customizations: false
      import_config_data:                ${{ inputs.import_config_data == true }}
      deployment_settings_file:          deployment-settings/perf/${{ matrix.solution }}.json
      jfrog_url:                         ${{ vars.JFROG_URL || '' }}
      jfrog_repo:                        ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      build_run_number:                  ${{ github.run_number }}
      build_run_attempt:                 ${{ github.run_attempt }}
    secrets: inherit

  # ============================================================================
  # GATE ─ Prod
  # ============================================================================
  gate-prod:
    name: "🔐 Gate | Prod"
    needs: [setup, deploy-perf]
    if: >
      needs.deploy-perf.result == 'success' &&
      inputs.target_environments == 'all'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Gate approved
        shell: pwsh
        run: |
          Write-Host "✅ Prod gate approved for run #${{ github.run_number }}"
          Write-Host "Solutions about to deploy: ${{ needs.setup.outputs.solution_list }}"

  # ============================================================================
  # JOB 6 ─ Deploy to Prod (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-prod:
    name: "🚀 Prod [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-prod]
    if: needs.gate-prod.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment_name:                  Prod
      environment_url:                   ${{ vars.PP_PROD_URL }}
      solution_name:                     ${{ matrix.solution }}
      solution_type:                     managed
      artifact_name:                     solution-${{ matrix.solution }}-${{ github.run_number }}
      solution_version:                  ${{ needs.build.outputs.solution_version }}
      enable_backup:                     ${{ inputs.enable_backup != false }}
      enable_blocking_check:             ${{ inputs.enable_blocking_check != false }}
      enable_version_compare:            ${{ inputs.enable_version_compare != false }}
      previous_environment_url:          ${{ vars.PP_PERF_URL }}
      mock_deploy:                       ${{ inputs.mock_deploy == true }}
      trigger_upgrade:                   ${{ inputs.trigger_upgrade == true }}
      overwrite_unmanaged_customizations: false
      import_config_data:                ${{ inputs.import_config_data == true }}
      deployment_settings_file:          deployment-settings/prod/${{ matrix.solution }}.json
      jfrog_url:                         ${{ vars.JFROG_URL || '' }}
      jfrog_repo:                        ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      build_run_number:                  ${{ github.run_number }}
      build_run_attempt:                 ${{ github.run_attempt }}
    secrets: inherit

  # ============================================================================
  # JOB 7 ─ JFrog Tag — Prod artifacts after successful Prod deploy
  # Sets properties: pipeline=release, environment=prod, approved=true
  # ============================================================================
  jfrog-tag-prod:
    name: "🏷️ JFrog Tag Prod | ${{ matrix.solution }}"
    needs: [setup, deploy-prod]
    if: >
      needs.deploy-prod.result == 'success' &&
      inputs.enable_jfrog_upload != false &&
      inputs.mock_deploy != true
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/_reusable-jfrog.yml
    with:
      action:         tag
      solution_name:  ${{ matrix.solution }}
      jfrog_url:      ${{ vars.JFROG_URL || '' }}
      jfrog_repo:     ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      tag_properties: "pipeline=release;environment=prod;approved=true;run=${{ github.run_number }}"
      mock_deploy:    false
    secrets: inherit

  # ============================================================================
  # JOB 8 ─ Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline Summary"
    needs:
      - setup
      - build
      - jfrog-upload
      - deploy-dev
      - gate-intg
      - deploy-intg
      - gate-uat
      - deploy-uat
      - gate-perf
      - deploy-perf
      - gate-prod
      - deploy-prod
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write pipeline summary
        shell: pwsh
        run: |
          & .github/scripts/Write-PipelineSummary.ps1 `
            -SolutionList      '${{ needs.setup.outputs.solution_list }}' `
            -SolutionCount     '${{ needs.setup.outputs.solution_count }}' `
            -RunNumber         '${{ github.run_number }}' `
            -RefName           '${{ github.ref_name }}' `
            -CommitSha         '${{ github.sha }}' `
            -SetupResult       '${{ needs.setup.result }}' `
            -BuildResult       '${{ needs.build.result }}' `
            -JFrogUploadResult '${{ needs.jfrog-upload.result }}' `
            -DeployDevResult   '${{ needs.deploy-dev.result }}' `
            -GateIntgResult    '${{ needs.gate-intg.result }}' `
            -DeployIntgResult  '${{ needs.deploy-intg.result }}' `
            -GateUatResult     '${{ needs.gate-uat.result }}' `
            -DeployUatResult   '${{ needs.deploy-uat.result }}' `
            -GatePerfResult    '${{ needs.gate-perf.result }}' `
            -DeployPerfResult  '${{ needs.deploy-perf.result }}' `
            -GateProdResult    '${{ needs.gate-prod.result }}' `
            -DeployProdResult  '${{ needs.deploy-prod.result }}'
