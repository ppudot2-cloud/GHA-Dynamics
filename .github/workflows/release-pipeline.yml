# =============================================================================
# WORKFLOW: Full Release Pipeline — Dev → Intg → UAT → Perf → Prod
# =============================================================================
#
# ┌─ SCENARIO SUPPORT ──────────────────────────────────────────────────────┐
# │  Single-solution repo : place one directory under src/solutions/, OR    │
# │                         set the PP_SOLUTION_NAME repo variable.         │
# │                         Leave `solutions` input as "all".               │
# │                                                                          │
# │  Multi-solution repo  : place each solution under src/solutions/<name>. │
# │                         Use `solutions` input to pick what deploys:     │
# │                           "all"                → every solution         │
# │                           "CoreSolution"       → one solution           │
# │                           "CoreSolution, ExtA" → explicit subset        │
# └─────────────────────────────────────────────────────────────────────────┘
#
# PIPELINE FLOW:
#   setup
#     └─► build (PARALLEL per solution)
#           └─► deploy-dev (SEQUENTIAL, max-parallel:1)
#                 └─► gate-intg  ← ONE approval regardless of solution count
#                       └─► deploy-intg (SEQUENTIAL)
#                             └─► gate-uat → deploy-uat
#                                   └─► gate-perf → deploy-perf
#                                         └─► gate-prod → deploy-prod
#   pipeline-summary (always)
#
# APPROVAL GATES:
#   Configure required reviewers in GitHub → Settings → Environments.
#   One approval per gate job covers all solutions for that environment.
#
# DEPLOY ORDERING:
#   Default: alphabetical. Custom order: create .github/solutions-config.json.
#
# NOTE: Solution Checker is ALWAYS enforced at build — it cannot be disabled.
# =============================================================================

name: Release Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/solutions/**'
      - 'config/**'

  workflow_dispatch:
    inputs:
      solutions:
        description: >
          Solutions to build and deploy.
          "all" = every solution in src/solutions/ (default).
          Comma-separated for a subset: "CoreSolution" or "CoreSolution, ExtA, ExtB".
          Single-solution repos: leave as "all".
        required: false
        default: 'all'
      target-environments:
        description: 'Which environments to deploy to'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - dev-intg
          - dev-intg-uat
      enable-backup:
        description: 'Backup each environment before deploying (rollback point)'
        required: false
        default: true
        type: boolean
      enable-blocking-check:
        description: 'Abort if environment has in-progress async operations'
        required: false
        default: true
        type: boolean
      enable-version-compare:
        description: 'Compare solution version vs previous environment before deploying'
        required: false
        default: true
        type: boolean
      mock-deploy:
        description: 'Dry run — run all checks but skip actual solution imports'
        required: false
        default: false
        type: boolean
      trigger-upgrade:
        description: 'Use holding-solution upgrade pattern vs in-place update'
        required: false
        default: false
        type: boolean
      import-config-data:
        description: 'Import configuration migration data after each solution import'
        required: false
        default: false
        type: boolean

concurrency:
  group: "release-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 0 ─ Setup
  # Discovers solutions, validates the selection, applies ordering, and outputs
  # the JSON matrix that every downstream job uses to fan out per solution.
  # ============================================================================
  setup:
    name: "🔍 Resolve Solutions"
    runs-on: ubuntu-latest
    outputs:
      matrix:         ${{ steps.resolve.outputs.matrix }}
      solution-list:  ${{ steps.resolve.outputs.solution-list }}
      solution-count: ${{ steps.resolve.outputs.solution-count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve solution list
        id: resolve
        shell: python3 {0}
        run: |
          import json, os, sys

          input_solutions  = "${{ inputs.solutions || 'all' }}".strip()
          pp_solution_name = "${{ vars.PP_SOLUTION_NAME }}".strip()
          solutions_dir    = "src/solutions"
          config_file      = ".github/solutions-config.json"

          # ── 1. Discover solutions from filesystem ──────────────────────────
          discovered = []
          if os.path.isdir(solutions_dir):
              discovered = sorted([
                  d for d in os.listdir(solutions_dir)
                  if os.path.isdir(os.path.join(solutions_dir, d)) and not d.startswith(".")
              ])

          # ── 2. Determine the selected solution set ─────────────────────────
          if input_solutions.lower() == "all":
              if discovered:
                  selected = discovered
                  print(f"ℹ️  Resolved all {len(discovered)} solution(s) from {solutions_dir}/")
              elif pp_solution_name:
                  selected = [pp_solution_name]
                  print(f"ℹ️  No src/solutions/ dirs found — using PP_SOLUTION_NAME: {pp_solution_name}")
              else:
                  print("::error::No solutions found in src/solutions/ and PP_SOLUTION_NAME is not set.")
                  sys.exit(1)
          else:
              selected = [s.strip() for s in input_solutions.split(",") if s.strip()]
              if not selected:
                  print("::error::The 'solutions' input is empty after parsing.")
                  sys.exit(1)
              if discovered:
                  unknown = [s for s in selected if s not in discovered]
                  if unknown:
                      print(f"::error::Solution(s) not found in {solutions_dir}/: {', '.join(unknown)}")
                      print(f"::error::Available: {', '.join(discovered)}")
                      sys.exit(1)

          # ── 3. Apply custom ordering from solutions-config.json (optional) ─
          if os.path.isfile(config_file):
              try:
                  with open(config_file) as f:
                      config = json.load(f)
                  selected_set = set(selected)
                  ordered = []
                  for entry in config.get("solutions", []):
                      name = entry["name"] if isinstance(entry, dict) else str(entry)
                      if name in selected_set:
                          ordered.append(name)
                          selected_set.discard(name)
                  ordered.extend(sorted(selected_set))
                  selected = ordered
                  print(f"ℹ️  Applied deploy ordering from {config_file}")
              except Exception as e:
                  print(f"::warning::Could not parse {config_file}: {e}. Using alphabetical order.")

          # ── 4. Write outputs ───────────────────────────────────────────────
          matrix        = json.dumps({"solution": selected})
          solution_list = ", ".join(selected)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"solution-list={solution_list}\n")
              f.write(f"solution-count={len(selected)}\n")

          print(f"\n✅ {len(selected)} solution(s) in deploy order:")
          for i, s in enumerate(selected, 1):
              print(f"   {i}. {s}")

      - name: Setup summary
        if: always()
        shell: bash
        run: |
          echo "## 🔍 Resolved Solutions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Solution | Deploy Order |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          IDX=1
          IFS=',' read -ra SOLS <<< "${{ steps.resolve.outputs.solution-list }}"
          for SOL in "${SOLS[@]}"; do
            TRIMMED="$(echo "$SOL" | xargs)"
            echo "| ${IDX} | \`${TRIMMED}\` | Sequential (${IDX} of ${{ steps.resolve.outputs.solution-count }}) |" >> "$GITHUB_STEP_SUMMARY"
            IDX=$((IDX+1))
          done

  # ============================================================================
  # JOB 1 ─ Build (runs in PARALLEL — one job per solution simultaneously)
  # Pack managed + unmanaged ZIPs, stamp version, run Solution Checker.
  # Artifact: solution-<SolutionName>-<run_number>
  # ============================================================================
  build:
    name: "🏗️ Build | ${{ matrix.solution }}"
    needs: setup
    if: needs.setup.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/_reusable-build.yml
    with:
      solution-name:          ${{ matrix.solution }}
      solution-folder:        src/solutions/${{ matrix.solution }}
      checker-geo:            ${{ vars.PP_CHECKER_GEO || 'UnitedStates' }}
      build-version-strategy: run_number
      data-schema-file:       ${{ vars.PP_DATA_SCHEMA_FILE || '' }}
      source-environment-url: ${{ vars.PP_SDBX_URL || '' }}
    secrets: inherit

  # ============================================================================
  # JOB 2 ─ Deploy to Dev (Unmanaged)
  # SEQUENTIAL within Dev (max-parallel: 1) to avoid PP async conflicts.
  # Order matches the deploy order resolved in setup.
  # ============================================================================
  deploy-dev:
    name: "🚀 Dev [Unmanaged] | ${{ matrix.solution }}"
    needs: [setup, build]
    if: >
      needs.build.result == 'success' &&
      (inputs.target-environments == 'all'           ||
       inputs.target-environments == 'dev'           ||
       inputs.target-environments == 'dev-intg'      ||
       inputs.target-environments == 'dev-intg-uat'  ||
       github.event_name == 'pull_request')
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    environment: Dev
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment-name:                   Dev
      environment-url:                    ${{ vars.PP_DEV_URL }}
      solution-name:                      ${{ matrix.solution }}
      solution-type:                      unmanaged
      artifact-name:                      solution-${{ matrix.solution }}-${{ github.run_number }}
      enable-backup:                      ${{ inputs.enable-backup != false }}
      enable-blocking-check:              ${{ inputs.enable-blocking-check != false }}
      enable-version-compare:             false
      mock-deploy:                        ${{ inputs.mock-deploy == true }}
      trigger-upgrade:                    false
      overwrite-unmanaged-customizations: true
      import-config-data:                 ${{ inputs.import-config-data == true }}
      deployment-settings-file:           deployment-settings/dev/${{ matrix.solution }}.json
    secrets: inherit

  # ============================================================================
  # GATE ─ Intg
  # ONE approval here covers ALL solutions deploying to Intg.
  # Set required reviewers: Settings → Environments → Intg.
  # ============================================================================
  gate-intg:
    name: "🔐 Gate | Intg"
    needs: [setup, deploy-dev]
    if: >
      needs.deploy-dev.result == 'success' &&
      (inputs.target-environments == 'all'          ||
       inputs.target-environments == 'dev-intg'     ||
       inputs.target-environments == 'dev-intg-uat' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    environment: Intg
    steps:
      - name: Gate approved
        run: |
          echo "✅ Intg gate approved for run #${{ github.run_number }}"
          echo "Solutions about to deploy: ${{ needs.setup.outputs.solution-list }}"

  # ============================================================================
  # JOB 3 ─ Deploy to Intg (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-intg:
    name: "🚀 Intg [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-intg]
    if: needs.gate-intg.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment-name:                   Intg
      environment-url:                    ${{ vars.PP_INTG_URL }}
      solution-name:                      ${{ matrix.solution }}
      solution-type:                      managed
      artifact-name:                      solution-${{ matrix.solution }}-${{ github.run_number }}
      enable-backup:                      ${{ inputs.enable-backup != false }}
      enable-blocking-check:              ${{ inputs.enable-blocking-check != false }}
      enable-version-compare:             ${{ inputs.enable-version-compare != false }}
      previous-environment-url:           ${{ vars.PP_DEV_URL }}
      mock-deploy:                        ${{ inputs.mock-deploy == true }}
      trigger-upgrade:                    ${{ inputs.trigger-upgrade == true }}
      overwrite-unmanaged-customizations: true
      import-config-data:                 ${{ inputs.import-config-data == true }}
      deployment-settings-file:           deployment-settings/intg/${{ matrix.solution }}.json
    secrets: inherit

  # ============================================================================
  # GATE ─ UAT
  # ============================================================================
  gate-uat:
    name: "🔐 Gate | UAT"
    needs: [setup, deploy-intg]
    if: >
      needs.deploy-intg.result == 'success' &&
      (inputs.target-environments == 'all'          ||
       inputs.target-environments == 'dev-intg-uat' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - name: Gate approved
        run: |
          echo "✅ UAT gate approved for run #${{ github.run_number }}"
          echo "Solutions about to deploy: ${{ needs.setup.outputs.solution-list }}"

  # ============================================================================
  # JOB 4 ─ Deploy to UAT (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-uat:
    name: "🚀 UAT [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-uat]
    if: needs.gate-uat.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment-name:                   UAT
      environment-url:                    ${{ vars.PP_UAT_URL }}
      solution-name:                      ${{ matrix.solution }}
      solution-type:                      managed
      artifact-name:                      solution-${{ matrix.solution }}-${{ github.run_number }}
      enable-backup:                      ${{ inputs.enable-backup != false }}
      enable-blocking-check:              ${{ inputs.enable-blocking-check != false }}
      enable-version-compare:             ${{ inputs.enable-version-compare != false }}
      previous-environment-url:           ${{ vars.PP_INTG_URL }}
      mock-deploy:                        ${{ inputs.mock-deploy == true }}
      trigger-upgrade:                    ${{ inputs.trigger-upgrade == true }}
      overwrite-unmanaged-customizations: false
      import-config-data:                 ${{ inputs.import-config-data == true }}
      deployment-settings-file:           deployment-settings/uat/${{ matrix.solution }}.json
    secrets: inherit

  # ============================================================================
  # GATE ─ Perf
  # ============================================================================
  gate-perf:
    name: "🔐 Gate | Perf"
    needs: [setup, deploy-uat]
    if: >
      needs.deploy-uat.result == 'success' &&
      inputs.target-environments == 'all'
    runs-on: ubuntu-latest
    environment: Perf
    steps:
      - name: Gate approved
        run: |
          echo "✅ Perf gate approved for run #${{ github.run_number }}"
          echo "Solutions about to deploy: ${{ needs.setup.outputs.solution-list }}"

  # ============================================================================
  # JOB 5 ─ Deploy to Perf (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-perf:
    name: "🚀 Perf [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-perf]
    if: needs.gate-perf.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment-name:                   Perf
      environment-url:                    ${{ vars.PP_PERF_URL }}
      solution-name:                      ${{ matrix.solution }}
      solution-type:                      managed
      artifact-name:                      solution-${{ matrix.solution }}-${{ github.run_number }}
      enable-backup:                      ${{ inputs.enable-backup != false }}
      enable-blocking-check:              ${{ inputs.enable-blocking-check != false }}
      enable-version-compare:             ${{ inputs.enable-version-compare != false }}
      previous-environment-url:           ${{ vars.PP_UAT_URL }}
      mock-deploy:                        ${{ inputs.mock-deploy == true }}
      trigger-upgrade:                    ${{ inputs.trigger-upgrade == true }}
      overwrite-unmanaged-customizations: false
      import-config-data:                 ${{ inputs.import-config-data == true }}
      deployment-settings-file:           deployment-settings/perf/${{ matrix.solution }}.json
    secrets: inherit

  # ============================================================================
  # GATE ─ Prod
  # ============================================================================
  gate-prod:
    name: "🔐 Gate | Prod"
    needs: [setup, deploy-perf]
    if: >
      needs.deploy-perf.result == 'success' &&
      inputs.target-environments == 'all'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Gate approved
        run: |
          echo "✅ Prod gate approved for run #${{ github.run_number }}"
          echo "Solutions about to deploy: ${{ needs.setup.outputs.solution-list }}"

  # ============================================================================
  # JOB 6 ─ Deploy to Prod (Managed) — SEQUENTIAL
  # ============================================================================
  deploy-prod:
    name: "🚀 Prod [Managed] | ${{ matrix.solution }}"
    needs: [setup, build, gate-prod]
    if: needs.gate-prod.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment-name:                   Prod
      environment-url:                    ${{ vars.PP_PROD_URL }}
      solution-name:                      ${{ matrix.solution }}
      solution-type:                      managed
      artifact-name:                      solution-${{ matrix.solution }}-${{ github.run_number }}
      enable-backup:                      ${{ inputs.enable-backup != false }}
      enable-blocking-check:              ${{ inputs.enable-blocking-check != false }}
      enable-version-compare:             ${{ inputs.enable-version-compare != false }}
      previous-environment-url:           ${{ vars.PP_PERF_URL }}
      mock-deploy:                        ${{ inputs.mock-deploy == true }}
      trigger-upgrade:                    ${{ inputs.trigger-upgrade == true }}
      overwrite-unmanaged-customizations: false
      import-config-data:                 ${{ inputs.import-config-data == true }}
      deployment-settings-file:           deployment-settings/prod/${{ matrix.solution }}.json
    secrets: inherit

  # ============================================================================
  # JOB 7 ─ Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline Summary"
    needs:
      - setup
      - build
      - deploy-dev
      - gate-intg
      - deploy-intg
      - gate-uat
      - deploy-uat
      - gate-perf
      - deploy-perf
      - gate-prod
      - deploy-prod
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        shell: bash
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❌" ;;
            esac
          }

          echo "# 🏭 Release Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Solutions:** \`${{ needs.setup.outputs.solution-list }}\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** \`#${{ github.run_number }}\` | **Ref:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Environment | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔍 Resolve | — | $(icon '${{ needs.setup.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🏗️ Build (×${{ needs.setup.outputs.solution-count }}) | — | $(icon '${{ needs.build.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚀 Deploy | Dev | $(icon '${{ needs.deploy-dev.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Gate | Intg | $(icon '${{ needs.gate-intg.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚀 Deploy | Intg | $(icon '${{ needs.deploy-intg.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Gate | UAT | $(icon '${{ needs.gate-uat.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚀 Deploy | UAT | $(icon '${{ needs.deploy-uat.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Gate | Perf | $(icon '${{ needs.gate-perf.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚀 Deploy | Perf | $(icon '${{ needs.deploy-perf.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Gate | Prod | $(icon '${{ needs.gate-prod.result }}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚀 Deploy | Prod | $(icon '${{ needs.deploy-prod.result }}') |" >> "$GITHUB_STEP_SUMMARY"
