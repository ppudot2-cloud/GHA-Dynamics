# =============================================================================
# WORKFLOW: Build and Deploy — Pipeline 1 (all pre-prod environments)
# =============================================================================
#
# TWO-PIPELINE ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
#
#   Pipeline 1 — THIS WORKFLOW  (manual trigger)
#     1. Export solutions from sandbox (PP_SDBX_URL)
#        └─ Commit exported source + pipeline-context.json to feature/pipeline-{run_number}
#     2. Build (pack ZIPs, Solution Checker, JFrog archival)
#        └─ Validate pipeline config (toggles, URLs, service connections)
#     3. Deploy → Dev → Intg → UAT → FRS → Perf  (parallel, individual approval gates)
#        ↳ Prod is BLOCKED — only deployable from a PR to main (Pipeline 2)
#     4. Auto-create PR: feature/pipeline-{run_number} → main  (after UAT passes)
#
#   Pipeline 2 — deploy-prod.yml  (fires when the above PR is opened)
#     Deploy → UAT (re-validation) → Prod  (approval gates)
#
# ROLLBACK
#   Set enable_backup=true to take a pre-import backup at every environment.
#   Backups are stored as GitHub artifacts (backup-{env}-v{run_number}).
#   To restore: run rollback.yml and supply the run number.
#   Default is false — no backups are taken (faster deployments).
#
# ARTIFACT HANDOFF
#   Phase 1 uploads solution-artifact-* (7-day retention).
#   Pipeline 2 downloads the same artifacts via source_run_id from pipeline-context.json.
# =============================================================================

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: '"all" or comma-separated solution names'
        required: false
        default: 'all'

      mock_deploy:
        description: >
          Dry run — simulate export, build, and deploy without touching Power Platform,
          git, or JFrog. No branch is created, no PR is raised.
        required: false
        default: false
        type: boolean

      checker_error_level:
        description: 'Minimum severity that fails Solution Checker'
        required: false
        default: 'HighIssue'
        type: choice
        options:
          - CriticalIssue
          - HighIssue
          - MediumIssue
          - LowIssue
          - InformationalIssue

      base_solutions:
        description: 'Comma-separated base solution names to verify are installed'
        required: false
        default: ''

      enable_backup:
        description: >
          Take a pre-import backup at every environment (enables rollback via rollback.yml).
          Default false — skip backups for faster deployments.
        required: false
        default: false
        type: boolean

concurrency:
  group: "build-and-deploy-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Setup — resolve solution matrix
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    outputs:
      matrix:           ${{ steps.resolve.outputs.matrix }}
      solution_list:    ${{ steps.resolve.outputs.solution_list }}
      solution_count:   ${{ steps.resolve.outputs.solution_count }}
      # Secret-presence flags — pre-evaluated here because secrets.* is not
      # accessible in reusable workflow `with:` blocks (only in run: / env:).
      pp_app_id_set:    ${{ steps.check-creds.outputs.pp_app_id_set }}
      pp_secret_set:    ${{ steps.check-creds.outputs.pp_secret_set }}
      pp_tenant_set:    ${{ steps.check-creds.outputs.pp_tenant_set }}
      gha_core_pat_set: ${{ steps.check-creds.outputs.gha_core_pat_set }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

      - name: Check credential presence
        id: check-creds
        shell: pwsh
        run: |
          # Evaluate secret presence in a run: step (the only place secrets.* is allowed).
          # Outputs are true/false strings consumed by stage-build's validate job.
          $r = @{
            pp_app_id_set    = ('${{ secrets.PP_APP_ID }}'         -ne '')
            pp_secret_set    = ('${{ secrets.PP_CLIENT_SECRET }}'  -ne '')
            pp_tenant_set    = ('${{ secrets.PP_TENANT_ID }}'      -ne '')
            gha_core_pat_set = ('${{ secrets.GHA_CORE_PAT }}'      -ne '')
          }
          foreach ($k in $r.Keys) {
            "$k=$($r[$k].ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "  $k = $($r[$k])"
          }

  # ============================================================================
  # Stage 1 — Export from sandbox  (or simulate in mock mode)
  #
  # Contains two jobs (visible as a collapsible group in the GitHub Actions UI):
  #   📤 Export | <SolutionName>  — one per solution, run in parallel
  #   🌿 Commit to feature/pipeline-{run_number}  — runs after all exports finish
  #
  # Real mode:  exports each solution from PP_SDBX_URL via PAC CLI, then pushes
  #             a feature branch with the exported source.
  # Mock mode:  export-solution action logs "[MOCK]" and reuses src/solutions/;
  #             git operations (branch + push) always run for real.
  # ============================================================================
  stage-export:
    name: "📤 Export from Sandbox"
    needs: setup
    permissions:
      id-token: write
      contents: write   # commit job needs push access
      actions:  read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-export.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      source_environment_url: ${{ vars.PP_SDBX_URL || 'https://mock.crm.dynamics.com' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
    secrets: inherit

  # ============================================================================
  # Stage 2 — Build
  #
  # Contains two job groups (visible inside the Build collapsible group):
  #   🏗️ Build — <SolutionName>  — pack ZIPs, Solution Checker, JFrog archival
  #   🔎 Validate Pipeline Config  — prints all toggles, URLs, secret status
  #
  # Packs ZIPs, runs Solution Checker, uploads solution-artifact-* (7-day)
  # and archives to JFrog for long-term storage.
  # Validation runs after all builds pass — fails non-mock if secrets/URLs missing.
  # ============================================================================
  stage-build:
    name: "🏗️ Build"
    needs: [setup, stage-export]
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      use_exported_source:    ${{ inputs.mock_deploy != true }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      jfrog_url:              ${{ vars.JFROG_URL || '' }}
      jfrog_repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      checker_error_level:    ${{ inputs.checker_error_level || 'HighIssue' }}
      # ── Validate job context (vars cannot cross repo boundaries) ────────────
      enable_backup:          ${{ inputs.enable_backup == true }}
      base_solutions:         ${{ inputs.base_solutions || '' }}
      solution_count:         ${{ needs.setup.outputs.solution_count }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      pp_sdbx_url:            ${{ vars.PP_SDBX_URL || '' }}
      pp_dev_url:             ${{ vars.PP_DEV_URL || '' }}
      pp_intg_url:            ${{ vars.PP_INTG_URL || '' }}
      pp_uat_url:             ${{ vars.PP_UAT_URL || '' }}
      pp_frs_url:             ${{ vars.PP_FRS_URL || '' }}
      pp_perf_url:            ${{ vars.PP_PERF_URL || '' }}
      pp_prod_url:            ${{ vars.PP_PROD_URL || '' }}
      pp_app_id_set:          ${{ needs.setup.outputs.pp_app_id_set == 'true' }}
      pp_secret_set:          ${{ needs.setup.outputs.pp_secret_set == 'true' }}
      pp_tenant_set:          ${{ needs.setup.outputs.pp_tenant_set == 'true' }}
      gha_core_pat_set:       ${{ needs.setup.outputs.gha_core_pat_set == 'true' }}
    secrets: inherit

  # ============================================================================
  # Stage 3 — Deploy  (5 parallel jobs, each with its own approval gate)
  # All start immediately after stage-build (which includes validation).
  # create-main-pr depends ONLY on deploy-uat — FRS/Perf run independently.
  # ============================================================================

  deploy-dev:
    name: "🚀 Deploy | Dev"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: CI Bootstrap
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/ci-bootstrap@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         false
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Dev
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Dev
          environment_url:          ${{ vars.PP_DEV_URL }}
          solution_type:            Unmanaged
          enable_backup:            ${{ inputs.enable_backup == true }}
          enable_blocking_check:    false
          enable_version_compare:   false
          import_config_data:       false
          previous_environment_url: ''
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}

  deploy-intg:
    name: "🚀 Deploy | Intg"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Intg
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: CI Bootstrap
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/ci-bootstrap@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         false
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Intg
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Intg
          environment_url:          ${{ vars.PP_INTG_URL }}
          solution_type:            Managed
          enable_backup:            ${{ inputs.enable_backup == true }}
          enable_blocking_check:    true
          enable_version_compare:   false
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_DEV_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}

  deploy-uat:
    name: "🚀 Deploy | UAT"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: UAT
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: CI Bootstrap
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/ci-bootstrap@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         false
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → UAT
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         UAT
          environment_url:          ${{ vars.PP_UAT_URL }}
          solution_type:            Managed
          enable_backup:            ${{ inputs.enable_backup == true }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_INTG_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}

  deploy-frs:
    name: "🚀 Deploy | FRS"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: FRS
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: CI Bootstrap
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/ci-bootstrap@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         false
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → FRS
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         FRS
          environment_url:          ${{ vars.PP_FRS_URL }}
          solution_type:            Managed
          enable_backup:            ${{ inputs.enable_backup == true }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_UAT_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}

  deploy-perf:
    name: "🚀 Deploy | Perf"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Perf
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: CI Bootstrap
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/ci-bootstrap@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         false
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: solution-artifact-*
          path: .
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Perf
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Perf
          environment_url:          ${{ vars.PP_PERF_URL }}
          solution_type:            Managed
          enable_backup:            ${{ inputs.enable_backup == true }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_FRS_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}

  # ============================================================================
  # Create PR: feature/pipeline-{run_number} → main
  # Opens as soon as UAT passes. FRS and Perf continue independently.
  # Merging this PR triggers deploy-prod.yml (UAT re-validation → Prod).
  # ============================================================================
  create-main-pr:
    name: "🔀 Open PR → main"
    needs: [setup, stage-export, deploy-uat]
    if: |
      needs.deploy-uat.result == 'success' &&
      needs.stage-export.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Create PR feature → main
        env:
          # GITHUB_TOKEN is blocked when "Allow GitHub Actions to create and approve
          # pull requests" is disabled in repo settings. GHA_CORE_PAT (a real PAT)
          # bypasses that restriction.
          GH_TOKEN: ${{ secrets.GHA_CORE_PAT }}
        shell: bash
        run: |
          FEATURE="${{ needs.stage-export.outputs.feature_branch }}"
          MOCK_LABEL="${{ inputs.mock_deploy == true && '[MOCK] ' || '' }}"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "$FEATURE" \
            --base "main" \
            --title "${MOCK_LABEL}Release: pipeline run #${{ github.run_number }}" \
            --body "## ✅ UAT passed — ready for Prod

          **Pipeline run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Branch:** \`$FEATURE\`
          **Solutions:** ${{ needs.setup.outputs.solution_list }}
          **Triggered by:** @${{ github.actor }}
          **Mock deploy:** ${{ inputs.mock_deploy }}

          ### Gate status at PR creation
          - [x] Solution Checker: passed
          - [x] Dev: success
          - [x] Intg: success
          - [x] UAT: success
          - [ ] FRS: running in parallel (not required for this PR)
          - [ ] Perf: running in parallel (not required for this PR)

          Merging this PR triggers **deploy-prod.yml** (UAT re-validation → Prod, both gated)." \
          )
          echo "✅ PR created: $PR_URL"

  # ============================================================================
  # Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline Summary"
    needs: [setup, stage-export, stage-build, deploy-dev, deploy-intg, deploy-uat, deploy-frs, deploy-perf, create-main-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Download job summary records
        uses: actions/download-artifact@v4
        with:
          pattern: "job-summary-*"
          path: job-summaries/
          merge-multiple: true
        continue-on-error: true

      - name: Write pipeline summary
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Write-PipelineSummary.ps1 `
            -SolutionList    '${{ needs.setup.outputs.solution_list }}' `
            -SolutionCount   '${{ needs.setup.outputs.solution_count }}' `
            -RunNumber       '${{ github.run_number }}' `
            -RefName         '${{ github.ref_name }}' `
            -CommitSha       '${{ github.sha }}' `
            -ExportResult    '${{ needs.stage-export.result }}' `
            -BuildResult     '${{ needs.stage-build.result }}' `
            -DeployResult    '${{ needs.deploy-uat.result }}' `
            -JobSummariesDir 'job-summaries'

      - name: Send failure notification
        if: >
          needs.stage-export.result  == 'failure' ||
          needs.stage-build.result   == 'failure' ||
          needs.deploy-dev.result    == 'failure' ||
          needs.deploy-intg.result   == 'failure' ||
          needs.deploy-uat.result    == 'failure' ||
          needs.deploy-frs.result    == 'failure' ||
          needs.deploy-perf.result   == 'failure'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ppudot1@gmail.com
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject:        "❌ Build and Deploy FAILED — ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Pipeline 1 failed for run #${{ github.run_number }}.

            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}

            Stage results:
              Export : ${{ needs.stage-export.result }}
              Build  : ${{ needs.stage-build.result }}
              Dev    : ${{ needs.deploy-dev.result }}
              Intg   : ${{ needs.deploy-intg.result }}
              UAT    : ${{ needs.deploy-uat.result }}
              FRS    : ${{ needs.deploy-frs.result }}
              Perf   : ${{ needs.deploy-perf.result }}

            Solutions: ${{ needs.setup.outputs.solution_list }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
