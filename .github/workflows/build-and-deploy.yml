# =============================================================================
# WORKFLOW: Build and Deploy
# =============================================================================
#
# STAGES
# ─────────────────────────────────────────────────────────────────────────────
#   1. Setup    — resolve solution matrix, read Core vars (JFrog, base solutions)
#   2. Export   — lint + export run in parallel; commit waits for both
#   3. Build    — validate pipeline config first, then pack ZIPs + Solution Checker
#   4. Deploy   — Dev / Intg / UAT / FRS / Perf in parallel, each with approval gate
#
# ROLLBACK
# ─────────────────────────────────────────────────────────────────────────────
# Set ENABLE_ROLLBACK=true as a GitHub Environment variable (per environment) to
# take a pre-import backup and restore automatically on import failure.
# For manual rollback trigger GHA-Core/.github/workflows/rollback.yml.
#
# PROD DEPLOYMENT
# ─────────────────────────────────────────────────────────────────────────────
# Prod is deployed by deploy-prod.yml, which fires when the feature branch PR
# is merged to main. Set SKIP_UAT=true repo variable to bypass UAT re-validation
# in an emergency.
# =============================================================================

name: Build and Deploy

on:
  # ── Auto-trigger when solution source is pushed to a feature branch ──────────
  push:
    branches:
      - 'feature/**'
    paths-ignore:
      - 'pipeline-context.json'

  workflow_dispatch:
    inputs:
      solutions:
        description: '"all" or comma-separated solution names'
        required: false
        default: 'all'
        type: string

      skip_export:
        description: >
          Skip sandbox export — build from source already committed to this branch.
        required: false
        default: false
        type: boolean

      mock_deploy:
        description: >
          Simulation mode — skips ALL Azure/PP/JFrog connections. Safe to run without
          a real App Registration, Key Vault, or Power Platform environment.
          Git operations still run; no real import/export happens.
        required: false
        default: false
        type: boolean

concurrency:
  group: "build-and-deploy-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1 — Setup
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix:           ${{ steps.resolve.outputs.matrix }}
      solution_list:    ${{ steps.resolve.outputs.solution_list }}
      solution_count:   ${{ steps.resolve.outputs.solution_count }}
      pp_app_id_set:    ${{ steps.check-creds.outputs.pp_app_id_set }}
      pp_secret_set:    ${{ steps.check-creds.outputs.pp_secret_set }}
      pp_tenant_set:    ${{ steps.check-creds.outputs.pp_tenant_set }}
      gha_core_pat_set: ${{ steps.check-creds.outputs.gha_core_pat_set }}
      jfrog_url:        ${{ steps.core-vars.outputs.jfrog_url }}
      jfrog_repo:       ${{ steps.core-vars.outputs.jfrog_repo }}
      base_solutions:   ${{ steps.core-vars.outputs.base_solutions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT || github.token }}

      - name: Read Core pipeline variables (JFROG)
        id: core-vars
        shell: pwsh
        run: |
          # JFROG_URL and JFROG_REPO are protected Core variables.
          # Read them from global-vars.yml so the project layer cannot override them.
          $content   = Get-Content '.ci/.github/variables/dynamics/global-vars.yml' -Raw
          $jfrogUrl      = if ($content -match '(?m)^\s+JFROG_URL:\s*"?([^"\n]*?)"?\s*$')      { $Matches[1].Trim() } else { '' }
          $jfrogRepo     = if ($content -match '(?m)^\s+JFROG_REPO:\s*"?([^"\n]*?)"?\s*$')     { $Matches[1].Trim() } else { 'powerplatform-solutions' }
          $baseSolutions = if ($content -match '(?m)^\s+BASE_SOLUTIONS:\s*"?([^"\n]*?)"?\s*$') { $Matches[1].Trim() } else { '' }
          "jfrog_url=$jfrogUrl"           | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "jfrog_repo=$jfrogRepo"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_solutions=$baseSolutions" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "  JFROG_URL       = $(if ($jfrogUrl) { $jfrogUrl } else { '(not set — JFrog archival disabled)' })"
          Write-Host "  JFROG_REPO      = $jfrogRepo"
          Write-Host "  BASE_SOLUTIONS  = $(if ($baseSolutions) { $baseSolutions } else { '(not set — base-solution checks skipped)' })"

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

      - name: Check credential presence
        id: check-creds
        shell: pwsh
        run: |
          $r = @{
            pp_app_id_set    = ('${{ secrets.PP_APP_ID }}'         -ne '')
            pp_secret_set    = ('${{ secrets.PP_CLIENT_SECRET }}'  -ne '')
            pp_tenant_set    = ('${{ secrets.PP_TENANT_ID }}'      -ne '')
            gha_core_pat_set = ('${{ secrets.GHA_CORE_PAT }}'      -ne '')
          }
          foreach ($k in $r.Keys) {
            "$k=$($r[$k].ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "  $k = $($r[$k])"
          }

  # ============================================================================
  # Stage 2 — Export
  # Lint and export run in parallel; commit waits for both to succeed.
  # ============================================================================
  stage-export:
    name: "📤 Export / Commit"
    needs: [setup]
    permissions:
      id-token:      write
      contents:      write
      actions:       read
      pull-requests: write
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-export.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      source_environment_url: ${{ vars.PP_SDBX_URL || 'https://mock.crm.dynamics.com' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      skip_export:            ${{ inputs.skip_export == true || github.event_name == 'push' }}
      azure_client_id:        ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:        ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_key_vault_name:   ${{ vars.AZURE_KEY_VAULT_NAME }}
    secrets: inherit

  # ============================================================================
  # Stage 3 — Build
  # Validate pipeline config first; build matrix runs after validation passes.
  # ============================================================================
  stage-build:
    name: "🏗️ Build"
    needs: [setup, stage-export]
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      use_exported_source:    ${{ inputs.mock_deploy != true && inputs.skip_export != true && github.event_name != 'push' }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      jfrog_url:              ${{ needs.setup.outputs.jfrog_url }}
      jfrog_repo:             ${{ needs.setup.outputs.jfrog_repo }}
      enable_backup:          ${{ vars.ENABLE_ROLLBACK == 'true' }}
      base_solutions:         ${{ needs.setup.outputs.base_solutions }}
      solution_count:         ${{ needs.setup.outputs.solution_count }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      pp_sdbx_url:            ${{ vars.PP_SDBX_URL || '' }}
      pp_dev_url:             ${{ vars.PP_DEV_URL || '' }}
      pp_intg_url:            ${{ vars.PP_INTG_URL || '' }}
      pp_uat_url:             ${{ vars.PP_UAT_URL || '' }}
      pp_frs_url:             ${{ vars.PP_FRS_URL || '' }}
      pp_perf_url:            ${{ vars.PP_PERF_URL || '' }}
      pp_prod_url:            ${{ vars.PP_PROD_URL || '' }}
      pp_app_id_set:          ${{ needs.setup.outputs.pp_app_id_set == 'true' }}
      pp_secret_set:          ${{ needs.setup.outputs.pp_secret_set == 'true' }}
      pp_tenant_set:          ${{ needs.setup.outputs.pp_tenant_set == 'true' }}
      gha_core_pat_set:       ${{ needs.setup.outputs.gha_core_pat_set == 'true' }}
      azure_client_id:        ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:        ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_key_vault_name:   ${{ vars.AZURE_KEY_VAULT_NAME }}
    secrets: inherit

  # ============================================================================
  # Stage 4 — Deploy  (all environments in parallel, each with approval gate)
  # Set ENABLE_ROLLBACK=true as a GitHub Environment variable per environment
  # to enable automatic pre-import backup and restore on failure.
  # ============================================================================

  deploy-dev:
    name: "🚀 Deploy | Dev"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ needs.setup.outputs.jfrog_url != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Dev
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Dev
          environment_url:          ${{ vars.PP_DEV_URL }}
          solution_type:            Unmanaged
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    false
          enable_version_compare:   false
          import_config_data:       false
          previous_environment_url: ''
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ needs.setup.outputs.base_solutions }}
          jfrog_url:                ${{ needs.setup.outputs.jfrog_url }}
          jfrog_repo:               ${{ needs.setup.outputs.jfrog_repo }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-intg:
    name: "🚀 Deploy | Intg"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Intg
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ needs.setup.outputs.jfrog_url != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Intg
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Intg
          environment_url:          ${{ vars.PP_INTG_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_DEV_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ needs.setup.outputs.base_solutions }}
          jfrog_url:                ${{ needs.setup.outputs.jfrog_url }}
          jfrog_repo:               ${{ needs.setup.outputs.jfrog_repo }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-uat:
    name: "🚀 Deploy | UAT"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: UAT
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ needs.setup.outputs.jfrog_url != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → UAT
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         UAT
          environment_url:          ${{ vars.PP_UAT_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_INTG_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ needs.setup.outputs.base_solutions }}
          jfrog_url:                ${{ needs.setup.outputs.jfrog_url }}
          jfrog_repo:               ${{ needs.setup.outputs.jfrog_repo }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-frs:
    name: "🚀 Deploy | FRS"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: FRS
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ needs.setup.outputs.jfrog_url != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → FRS
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         FRS
          environment_url:          ${{ vars.PP_FRS_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_UAT_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ needs.setup.outputs.base_solutions }}
          jfrog_url:                ${{ needs.setup.outputs.jfrog_url }}
          jfrog_repo:               ${{ needs.setup.outputs.jfrog_repo }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-perf:
    name: "🚀 Deploy | Perf"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Perf
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ needs.setup.outputs.jfrog_url != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Perf
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Perf
          environment_url:          ${{ vars.PP_PERF_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_FRS_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ needs.setup.outputs.base_solutions }}
          jfrog_url:                ${{ needs.setup.outputs.jfrog_url }}
          jfrog_repo:               ${{ needs.setup.outputs.jfrog_repo }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

