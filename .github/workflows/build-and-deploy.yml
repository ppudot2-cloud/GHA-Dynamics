# =============================================================================
# WORKFLOW: Build and Deploy — Pipeline 1 (all pre-prod environments)
# =============================================================================
#
# TWO-PIPELINE ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
#
#   Pipeline 1 — THIS WORKFLOW  (manual trigger OR push to feature/*)
#     1. [Optional] PR Validation   — build + Solution Checker only (no deploy)
#                                     Controlled by run_pr_validation input (default true on push)
#     2. [Optional] Pipeline Tests  — full mock run from GHA-Core
#                                     Controlled by run_pipeline_tests input (default false)
#     3. Lint                       — validates solutions.json, deployment-settings, project-vars.yml
#     4. Export solutions from sandbox (PP_SDBX_URL) — skipped when skip_export=true
#        └─ Commit exported source + pipeline-context.json to feature/* branch
#     5. Build (pack ZIPs, Solution Checker, JFrog archival)
#        └─ Validate pipeline config (toggles, URLs, service connections)
#     6. Deploy → Dev → Intg → UAT → FRS → Perf  (each with its own approval gate)
#        ↳ Prod is BLOCKED — only deployable from Pipeline 2 after PR merge
#     7. Auto-create PR: feature/* → main  (after UAT passes)
#
#   Pipeline 2 — deploy-prod.yml  (fires when the above PR is merged)
#     Deploy → UAT (re-validation) → Prod  (approval gates)
#
# ROLLBACK
# ─────────────────────────────────────────────────────────────────────────────
# Set ENABLE_ROLLBACK=true as a GitHub Environment variable (per environment) to
# take a pre-import backup automatically and restore it if the import fails.
# No manual workflow dispatch needed — this is auto-rollback on failure.
#
# For manual rollback after a failed deploy, trigger:
#   GHA-Core/.github/workflows/rollback.yml
# from GHA-Core's Actions tab.
#
# SKIP_UAT (PIPELINE 2)
# ─────────────────────────────────────────────────────────────────────────────
# If UAT is unavailable and blocking a Prod deployment:
#   Option A: Re-dispatch deploy-prod.yml manually with skip_uat=true
#   Option B: Set repo variable SKIP_UAT=true (works even on auto-triggered runs)
#
# ARTIFACT HANDOFF
# ─────────────────────────────────────────────────────────────────────────────
# Pipeline 1 uploads solution-artifact-* (7-day retention).
# Pipeline 2 downloads the same artifacts via source_run_id from pipeline-context.json.
# =============================================================================

name: Build and Deploy

on:
  # ── Auto-trigger when solution source is pushed to a feature branch ──────────
  push:
    branches:
      - 'feature/**'
    paths-ignore:
      - 'pipeline-context.json'

  workflow_dispatch:
    inputs:
      solutions:
        description: '"all" or comma-separated solution names'
        required: false
        default: 'all'
        type: string

      skip_export:
        description: >
          Skip sandbox export — build from source already committed to this branch.
        required: false
        default: false
        type: boolean

      mock_deploy:
        description: >
          Dry run — simulate export, build, and deploy without touching Power Platform,
          git, or JFrog. No branch is created, no PR is raised.
        required: false
        default: false
        type: boolean

      checker_error_level:
        description: 'Minimum severity that fails Solution Checker'
        required: false
        default: 'HighIssue'
        type: choice
        options:
          - CriticalIssue
          - HighIssue
          - MediumIssue
          - LowIssue
          - InformationalIssue

      base_solutions:
        description: 'Comma-separated base solution names to verify are installed (informational only)'
        required: false
        default: ''

      run_pr_validation:
        description: >
          Run a build + Solution Checker check before the full pipeline stages.
          Useful for PRs and manual dispatches to get a fast build signal first.
          Automatically true when triggered by a push event.
        required: false
        default: false
        type: boolean

      run_pipeline_tests:
        description: >
          Run the full pipeline integration test (GHA-Core pipeline-test.yml) in mock mode
          before proceeding. Adds ~5 min but validates the entire Core stack end-to-end.
          Default false — enable when testing Core changes.
        required: false
        default: false
        type: boolean

concurrency:
  group: "build-and-deploy-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Setup — resolve solution matrix
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    outputs:
      matrix:           ${{ steps.resolve.outputs.matrix }}
      solution_list:    ${{ steps.resolve.outputs.solution_list }}
      solution_count:   ${{ steps.resolve.outputs.solution_count }}
      pp_app_id_set:    ${{ steps.check-creds.outputs.pp_app_id_set }}
      pp_secret_set:    ${{ steps.check-creds.outputs.pp_secret_set }}
      pp_tenant_set:    ${{ steps.check-creds.outputs.pp_tenant_set }}
      gha_core_pat_set: ${{ steps.check-creds.outputs.gha_core_pat_set }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

      - name: Check credential presence
        id: check-creds
        shell: pwsh
        run: |
          $r = @{
            pp_app_id_set    = ('${{ secrets.PP_APP_ID }}'         -ne '')
            pp_secret_set    = ('${{ secrets.PP_CLIENT_SECRET }}'  -ne '')
            pp_tenant_set    = ('${{ secrets.PP_TENANT_ID }}'      -ne '')
            gha_core_pat_set = ('${{ secrets.GHA_CORE_PAT }}'      -ne '')
          }
          foreach ($k in $r.Keys) {
            "$k=$($r[$k].ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "  $k = $($r[$k])"
          }

  # ============================================================================
  # [OPTIONAL] PR Validation — build + Solution Checker only
  #
  # Runs when:  push event (always)  OR  run_pr_validation=true (dispatch)
  # Provides a fast build signal before committing to the full pipeline.
  # Does NOT deploy — build artefacts are discarded.
  # Result is stored in pipeline-context.json and passed to Pipeline 2.
  # ============================================================================
  pr-validation:
    name: "🔎 PR Validation (build only)"
    needs: setup
    if: |
      github.event_name == 'push' ||
      inputs.run_pr_validation == true
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      mock_deploy:            false
      jfrog_url:              ''
      jfrog_repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      checker_error_level:    ${{ inputs.checker_error_level || vars.PP_CHECKER_ERROR_LEVEL || 'HighIssue' }}
      azure_client_id:        ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:        ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_key_vault_name:   ${{ vars.AZURE_KEY_VAULT_NAME }}
    secrets: inherit

  # ============================================================================
  # [OPTIONAL] Pipeline Integration Tests — full mock run from GHA-Core
  #
  # Runs when: run_pipeline_tests=true (dispatch only)
  # Validates the entire GHA-Core stack end-to-end in mock mode.
  # Only needed when testing Core changes or verifying a new project setup.
  # ============================================================================
  pipeline-tests:
    name: "🧪 Pipeline Integration Tests"
    needs: setup
    if: inputs.run_pipeline_tests == true
    uses: ppudot2-cloud/GHA-Core/.github/workflows/pipeline-test.yml@main
    with:
      solutions:   ${{ inputs.solutions || 'all' }}
      caller_repo: ${{ github.repository }}
    secrets: inherit

  # ============================================================================
  # Lint Pipeline Configuration (calls GHA-Core reusable lint workflow)
  #
  # Validates: solutions.json, deployment-settings paths + JSON,
  # project-vars.yml protected keys, unresolved #{TOKEN}# placeholders.
  # Failure here blocks stage-export from running.
  # ============================================================================
  lint-config:
    name: "🔍 Lint Pipeline Config"
    needs: setup
    permissions:
      contents: read
      pull-requests: write
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_reusable-lint.yml@main
    with:
      solutions_json_path: 'solutions.json'
      project_vars_path:   '.github/config/project-vars.yml'

  # ============================================================================
  # Stage 1 — Export from sandbox  (or skip when source is already committed)
  # ============================================================================
  stage-export:
    name: "📤 Export / Commit"
    needs: [setup, lint-config]
    if: needs.lint-config.result == 'success'
    permissions:
      id-token: write
      contents: write
      actions:  read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-export.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      source_environment_url: ${{ vars.PP_SDBX_URL || 'https://mock.crm.dynamics.com' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      skip_export:            ${{ inputs.skip_export == true || github.event_name == 'push' }}
      azure_client_id:        ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:        ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_key_vault_name:   ${{ vars.AZURE_KEY_VAULT_NAME }}
    secrets: inherit

  # ============================================================================
  # Stage 2 — Build
  # ============================================================================
  stage-build:
    name: "🏗️ Build"
    needs: [setup, stage-export]
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      use_exported_source:    ${{ inputs.mock_deploy != true && inputs.skip_export != true && github.event_name != 'push' }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      jfrog_url:              ${{ vars.JFROG_URL || '' }}
      jfrog_repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      checker_error_level:    ${{ inputs.checker_error_level || 'HighIssue' }}
      enable_backup:          ${{ vars.ENABLE_ROLLBACK == 'true' }}
      base_solutions:         ${{ inputs.base_solutions || '' }}
      solution_count:         ${{ needs.setup.outputs.solution_count }}
      solution_list:          ${{ needs.setup.outputs.solution_list }}
      pp_sdbx_url:            ${{ vars.PP_SDBX_URL || '' }}
      pp_dev_url:             ${{ vars.PP_DEV_URL || '' }}
      pp_intg_url:            ${{ vars.PP_INTG_URL || '' }}
      pp_uat_url:             ${{ vars.PP_UAT_URL || '' }}
      pp_frs_url:             ${{ vars.PP_FRS_URL || '' }}
      pp_perf_url:            ${{ vars.PP_PERF_URL || '' }}
      pp_prod_url:            ${{ vars.PP_PROD_URL || '' }}
      pp_app_id_set:          ${{ needs.setup.outputs.pp_app_id_set == 'true' }}
      pp_secret_set:          ${{ needs.setup.outputs.pp_secret_set == 'true' }}
      pp_tenant_set:          ${{ needs.setup.outputs.pp_tenant_set == 'true' }}
      gha_core_pat_set:       ${{ needs.setup.outputs.gha_core_pat_set == 'true' }}
      azure_client_id:        ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:        ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_key_vault_name:   ${{ vars.AZURE_KEY_VAULT_NAME }}
    secrets: inherit

  # ============================================================================
  # Stage 3 — Deploy  (5 parallel jobs, each with its own approval gate)
  # All start immediately after stage-build passes.
  # create-main-pr depends ONLY on deploy-uat — FRS/Perf run independently.
  #
  # ENABLE_ROLLBACK: set this as a GitHub Environment variable (per environment)
  # to enable automatic pre-import backup and restore on failure.
  # ============================================================================

  deploy-dev:
    name: "🚀 Deploy | Dev"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Dev
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Dev
          environment_url:          ${{ vars.PP_DEV_URL }}
          solution_type:            Unmanaged
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    false
          enable_version_compare:   false
          import_config_data:       false
          previous_environment_url: ''
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-intg:
    name: "🚀 Deploy | Intg"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Intg
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Intg
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Intg
          environment_url:          ${{ vars.PP_INTG_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_DEV_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-uat:
    name: "🚀 Deploy | UAT"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: UAT
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → UAT
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         UAT
          environment_url:          ${{ vars.PP_UAT_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_INTG_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-frs:
    name: "🚀 Deploy | FRS"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: FRS
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → FRS
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         FRS
          environment_url:          ${{ vars.PP_FRS_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_UAT_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  deploy-perf:
    name: "🚀 Deploy | Perf"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    environment: Perf
    permissions:
      id-token: write
      contents: read
      actions:  read
    env:
      GHA_CORE_PAT: ${{ secrets.GHA_CORE_PAT }}
    steps:
      - name: Reveille
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/reveille@main
        with:
          mock_deploy:           ${{ inputs.mock_deploy == true }}
          jfrog_enabled:         ${{ vars.JFROG_URL != '' }}
          mulesoft_enabled:      ${{ vars.MULESOFT_ENABLED == 'true' }}
          servicenow_enabled:    ${{ vars.SERVICENOW_ENABLED == 'true' }}
          azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure_key_vault_name:  ${{ vars.AZURE_KEY_VAULT_NAME }}
      - name: Install PAC CLI
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/pac-install@main
      - name: Download solution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern:      solution-artifact-*
          path:         .
          merge-multiple: true
          run-id:       ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all solutions → Perf
        uses: ppudot2-cloud/GHA-Core/.github/actions/dynamics/deploy-all-solutions@main
        with:
          solutions_json:           ${{ needs.setup.outputs.matrix }}
          environment_name:         Perf
          environment_url:          ${{ vars.PP_PERF_URL }}
          solution_type:            Managed
          enable_backup:            ${{ vars.ENABLE_ROLLBACK == 'true' }}
          enable_blocking_check:    true
          enable_version_compare:   true
          import_config_data:       false
          previous_environment_url: ${{ vars.PP_FRS_URL }}
          tag_prod_deployed:        false
          activate_flows:           true
          mock_deploy:              ${{ inputs.mock_deploy == true }}
          base_solutions:           ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
          jfrog_url:                ${{ vars.JFROG_URL || '' }}
          jfrog_repo:               ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
          run_number:               ${{ github.run_number }}
          run_attempt:              ${{ github.run_attempt }}
          enable_servicenow:        ${{ vars.SERVICENOW_ENABLED == 'true' }}
          solution_list:            ${{ needs.setup.outputs.solution_list }}

  # ============================================================================
  # Create PR: feature/pipeline-{run_number} → main
  # Opens as soon as UAT passes. FRS and Perf continue independently.
  # Merging this PR triggers deploy-prod.yml (UAT re-validation → Prod).
  # ============================================================================
  create-main-pr:
    name: "🔀 Open PR → main"
    needs: [setup, stage-export, deploy-uat, lint-config]
    if: |
      needs.deploy-uat.result == 'success' &&
      needs.stage-export.result == 'success' &&
      needs.lint-config.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Create PR feature → main
        env:
          GH_TOKEN: ${{ secrets.GHA_CORE_PAT }}
        shell: bash
        run: |
          FEATURE="${{ needs.stage-export.outputs.feature_branch }}"
          MOCK_LABEL="${{ inputs.mock_deploy == true && '[MOCK] ' || '' }}"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "$FEATURE" \
            --base "main" \
            --title "${MOCK_LABEL}Release: pipeline run #${{ github.run_number }}" \
            --body "## ✅ UAT passed — ready for Prod

          **Pipeline run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Branch:** \`$FEATURE\`
          **Solutions:** ${{ needs.setup.outputs.solution_list }}
          **Triggered by:** @${{ github.actor }}
          **Mock deploy:** ${{ inputs.mock_deploy }}

          ### Gate status at PR creation
          - [x] Solution Checker: passed
          - [x] Dev: success
          - [x] Intg: success
          - [x] UAT: success
          - [ ] FRS: running in parallel (not required for this PR)
          - [ ] Perf: running in parallel (not required for this PR)

          Merging this PR triggers **deploy-prod.yml** (UAT re-validation → Prod, both gated)." \
          )
          echo "✅ PR created: $PR_URL"

  # ============================================================================
  # Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline Summary"
    needs: [setup, lint-config, stage-export, stage-build, deploy-dev, deploy-intg, deploy-uat, deploy-frs, deploy-perf, create-main-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Download job summary records
        uses: actions/download-artifact@v4
        with:
          pattern: "job-summary-*"
          path: job-summaries/
          merge-multiple: true
        continue-on-error: true

      - name: Write pipeline summary
        shell: pwsh
        run: |
          & .ci/.github/scripts/dynamics/Write-PipelineSummary.ps1 `
            -SolutionList    '${{ needs.setup.outputs.solution_list }}' `
            -SolutionCount   '${{ needs.setup.outputs.solution_count }}' `
            -RunNumber       '${{ github.run_number }}' `
            -RefName         '${{ github.ref_name }}' `
            -CommitSha       '${{ github.sha }}' `
            -ExportResult    '${{ needs.stage-export.result }}' `
            -BuildResult     '${{ needs.stage-build.result }}' `
            -DeployResult    '${{ needs.deploy-uat.result }}' `
            -JobSummariesDir 'job-summaries'

      - name: Send failure notification
        if: >
          needs.stage-export.result  == 'failure' ||
          needs.stage-build.result   == 'failure' ||
          needs.deploy-dev.result    == 'failure' ||
          needs.deploy-intg.result   == 'failure' ||
          needs.deploy-uat.result    == 'failure' ||
          needs.deploy-frs.result    == 'failure' ||
          needs.deploy-perf.result   == 'failure'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER }}
          server_port:    ${{ vars.MAIL_PORT }}
          username:       ${{ vars.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ppudot1@gmail.com
          from:           GitHub Actions <${{ vars.MAIL_USERNAME }}>
          subject:        "❌ Build and Deploy FAILED — ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Pipeline 1 failed for run #${{ github.run_number }}.

            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}

            Stage results:
              Export : ${{ needs.stage-export.result }}
              Build  : ${{ needs.stage-build.result }}
              Dev    : ${{ needs.deploy-dev.result }}
              Intg   : ${{ needs.deploy-intg.result }}
              UAT    : ${{ needs.deploy-uat.result }}
              FRS    : ${{ needs.deploy-frs.result }}
              Perf   : ${{ needs.deploy-perf.result }}

            Solutions: ${{ needs.setup.outputs.solution_list }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
