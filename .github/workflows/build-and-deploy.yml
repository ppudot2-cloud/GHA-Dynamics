# =============================================================================
# WORKFLOW: Build and Deploy — Pipeline 1 (all pre-prod environments)
# =============================================================================
#
# TWO-PIPELINE ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
#
#   Pipeline 1 — THIS WORKFLOW  (manual trigger)
#     1. Export solutions from sandbox (PP_SDBX_URL)
#     2. Commit exported source + pipeline-context.json to feature/pipeline-{run_number}
#     3. Build (pack ZIPs, Solution Checker, JFrog archival)
#     4. Deploy → Dev → Intg → UAT → FRS → Perf  (sequential, approval gates)
#        ↳ Prod is BLOCKED — only deployable from a PR to main (Pipeline 2)
#     5. Auto-create PR: feature/pipeline-{run_number} → main
#
#   Pipeline 2 — deploy-prod.yml  (fires when the above PR is opened)
#     Deploy → UAT (re-validation) → Prod  (approval gates)
#
# ROLLBACK
#   Set enable_backup=true to take a pre-import backup at every environment.
#   Backups are stored as GitHub artifacts (backup-{env}-v{run_number}).
#   To restore: run rollback.yml and supply the run number.
#   Default is false — no backups are taken (faster deployments).
#
# ARTIFACT HANDOFF
#   Phase 1 uploads solution-artifact-* (7-day retention).
#   Pipeline 2 downloads the same artifacts via source_run_id from pipeline-context.json.
# =============================================================================

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: '"all" or comma-separated solution names'
        required: false
        default: 'all'

      mock_deploy:
        description: >
          Dry run — simulate export, build, and deploy without touching Power Platform,
          git, or JFrog. No branch is created, no PR is raised.
        required: false
        default: false
        type: boolean

      checker_error_level:
        description: 'Minimum severity that fails Solution Checker'
        required: false
        default: 'HighIssue'
        type: choice
        options:
          - CriticalIssue
          - HighIssue
          - MediumIssue
          - LowIssue
          - InformationalIssue

      trigger_upgrade:
        description: 'Use holding-solution upgrade pattern for managed imports'
        required: false
        default: false
        type: boolean

      base_solutions:
        description: 'Comma-separated base solution names to verify are installed'
        required: false
        default: ''

      enable_backup:
        description: >
          Take a pre-import backup at every environment (enables rollback via rollback.yml).
          Default false — skip backups for faster deployments.
        required: false
        default: false
        type: boolean

concurrency:
  group: "build-and-deploy-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Setup — resolve solution matrix
  # ============================================================================
  setup:
    name: "🔍 Setup"
    runs-on: ubuntu-latest
    outputs:
      matrix:         ${{ steps.resolve.outputs.matrix }}
      solution_list:  ${{ steps.resolve.outputs.solution_list }}
      solution_count: ${{ steps.resolve.outputs.solution_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Resolve solution matrix
        id: resolve
        shell: pwsh
        run: |
          & .ci/templates/steps/dynamics/Resolve-SolutionMatrix.ps1 `
            -InputSolutions    '${{ inputs.solutions || 'all' }}' `
            -PpSolutionName    '${{ vars.PP_SOLUTION_NAME }}' `
            -SolutionsJsonPath 'solutions.json'

  # ============================================================================
  # Stage 1 — Export from sandbox  (or simulate in mock mode)
  # Real mode:  exports each solution from PP_SDBX_URL via PAC CLI.
  # Mock mode:  export-solution action logs "[MOCK]" and reuses src/solutions/.
  # Always runs so commit-to-feature-branch always has artifacts to work with.
  # ============================================================================
  stage-export:
    name: "📤 Export from Sandbox"
    needs: setup
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-export.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      source_environment_url: ${{ vars.PP_SDBX_URL || 'https://mock.crm.dynamics.com' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
    secrets: inherit

  # ============================================================================
  # Commit exported source to feature branch  (or simulate in mock mode)
  # Real mode:  creates feature/pipeline-{run_number}, copies exported source,
  #             writes pipeline-context.json, pushes, ready for Pipeline 2.
  # Mock mode:  all git steps run locally; git push is skipped; branch name
  #             and pipeline-context.json are written so downstream jobs have
  #             the correct context values.
  # ============================================================================
  commit-to-feature-branch:
    name: "🌿 Commit to feature/pipeline-${{ github.run_number }}"
    needs: [setup, stage-export]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions:  read      # needed by download-artifact@v4 in same run
    outputs:
      feature_branch: ${{ steps.commit.outputs.feature_branch }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all exported source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: exported-source-*
          path: _export-src/
          merge-multiple: false

      - name: Create branch, copy source, write context, push (or simulate)
        id: commit
        shell: pwsh
        run: |
          $isMock     = '${{ inputs.mock_deploy }}' -eq 'true'
          $runNumber  = '${{ github.run_number }}'
          $runAttempt = '${{ github.run_attempt }}'
          $runId      = '${{ github.run_id }}'
          $branch     = "feature/pipeline-$runNumber"

          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"

          git checkout -b $branch
          Write-Host "$(if ($isMock) { '[MOCK] ' })Created branch: $branch"

          $solutions = '${{ needs.setup.outputs.solution_list }}' -split ',' |
            ForEach-Object { $_.Trim() } | Where-Object { $_ }

          foreach ($sol in $solutions) {
            $srcDir = "_export-src/exported-source-$sol"
            $dstDir = "src/solutions/$sol"
            if (Test-Path $srcDir) {
              if (Test-Path $dstDir) { Remove-Item $dstDir -Recurse -Force }
              Copy-Item $srcDir $dstDir -Recurse -Force
              Write-Host "  ✓ Copied $sol → src/solutions/$sol/"
            } else {
              Write-Warning "  ⚠ Exported source not found for $sol at $srcDir"
            }
          }

          # pipeline-context.json — read by Pipeline 2 to find Phase 1 artifacts
          $ctx = [ordered]@{
            runId         = $runId
            runNumber     = $runNumber
            runAttempt    = $runAttempt
            solutions     = $solutions
            solutionList  = '${{ needs.setup.outputs.solution_list }}'
            matrix        = '${{ needs.setup.outputs.matrix }}'
            featureBranch = $branch
            triggeredBy   = '${{ github.actor }}'
            triggeredAt   = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            mockDeploy    = $isMock
          }
          $ctx | ConvertTo-Json -Depth 3 | Set-Content 'pipeline-context.json' -Encoding UTF8
          Write-Host "  ✓ Written pipeline-context.json (runId=$runId)"

          if (Test-Path '_export-src') { Remove-Item '_export-src' -Recurse -Force }

          git add src/solutions/ pipeline-context.json

          if ($isMock) {
            # Show what would be committed but do NOT push
            $diff = git diff --cached --stat
            Write-Host ""
            Write-Host "[MOCK] Skipping git push — files that would be committed:" -ForegroundColor Cyan
            $diff | ForEach-Object { Write-Host "  $_" }
            Write-Host "[MOCK] Branch '$branch' exists locally only." -ForegroundColor Cyan

            # Step summary
            $summary  = "## Commit to Feature Branch - Simulation`n"
            $summary += "_mock_deploy=true - no changes pushed to GitHub_`n`n"
            $summary += "**Would push to branch:** ``$branch```n"
            $summary += "**Run ID:** $runId`n`n"
            $summary += "### Files that would be committed:`n``````n"
            $summary += ($diff -join "`n")
            $summary += "`n``````n"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            $status = git status --porcelain
            if ($status) {
              git commit -m "chore: export from sandbox — pipeline run #$runNumber [skip ci]"
              git push origin $branch
              Write-Host "  ✓ Committed and pushed to $branch"
            } else {
              Write-Host "  ℹ No source changes — pushing branch pointer only"
              git push origin $branch
            }
          }

          "feature_branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  # ============================================================================
  # Stage 2 — Build
  # Packs ZIPs, runs Solution Checker, uploads solution-artifact-* (7-day)
  # and archives to JFrog for long-term storage.
  # ============================================================================
  stage-build:
    name: "🏗️ Build"
    needs: [setup, stage-export, commit-to-feature-branch]
    # No mock bypass needed — stage-export and commit-to-feature-branch now always
    # run (mock mode is handled inside each stage). Build runs when they succeed.
    permissions:
      id-token: write
      contents: read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-build.yml@main
    with:
      matrix:                 ${{ needs.setup.outputs.matrix }}
      # mock mode reuses src/solutions/ directly (no artifact download needed)
      use_exported_source:    ${{ inputs.mock_deploy != true }}
      source_environment_url: ${{ vars.PP_SDBX_URL || '' }}
      mock_deploy:            ${{ inputs.mock_deploy == true }}
      jfrog_url:              ${{ vars.JFROG_URL || '' }}
      jfrog_repo:             ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      checker_error_level:    ${{ inputs.checker_error_level || 'HighIssue' }}
    secrets: inherit

  # ============================================================================
  # Stage 2.5 — Pipeline Validation
  # Runs after build, before deploy. Prints all toggles/flags so the team can
  # confirm what is on or off before any environment is touched. Validates that
  # required secrets and environment URLs are present (non-mock runs only).
  # ============================================================================
  validate-pipeline:
    name: "🔎 Validate Pipeline Config"
    needs: [setup, stage-build]
    if: needs.stage-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print toggles and validate config
        shell: pwsh
        run: |
          $isMock = '${{ inputs.mock_deploy }}' -eq 'true'

          function Flag($v) { if ($v -eq 'true') { '🟢 ON' } else { '🔴 OFF' } }

          Write-Host ""
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "   PIPELINE CONFIGURATION  —  Run #${{ github.run_number }}"
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host ""
          Write-Host "── Toggles ─────────────────────────────────────────────"
          Write-Host ("  {0,-24} {1}" -f "mock_deploy",         (Flag '${{ inputs.mock_deploy }}'))
          Write-Host ("  {0,-24} {1}" -f "enable_backup",       (Flag '${{ inputs.enable_backup }}'))
          Write-Host ("  {0,-24} {1}" -f "trigger_upgrade",     (Flag '${{ inputs.trigger_upgrade }}'))
          Write-Host ("  {0,-24} {1}" -f "checker_error_level", '${{ inputs.checker_error_level || 'HighIssue' }}')
          Write-Host ("  {0,-24} {1}" -f "base_solutions",      '${{ inputs.base_solutions || '(none)' }}')
          Write-Host ""
          Write-Host "── Solutions ───────────────────────────────────────────"
          Write-Host ("  {0,-24} {1}" -f "Count",  '${{ needs.setup.outputs.solution_count }}')
          Write-Host ("  {0,-24} {1}" -f "List",   '${{ needs.setup.outputs.solution_list }}')
          Write-Host ""
          Write-Host "── Environment URLs ────────────────────────────────────"
          $urls = [ordered]@{
            'Sandbox (export)' = '${{ vars.PP_SDBX_URL }}'
            'Dev'              = '${{ vars.PP_DEV_URL }}'
            'Intg'             = '${{ vars.PP_INTG_URL }}'
            'UAT'              = '${{ vars.PP_UAT_URL }}'
            'FRS'              = '${{ vars.PP_FRS_URL }}'
            'Perf'             = '${{ vars.PP_PERF_URL }}'
            'Prod'             = '${{ vars.PP_PROD_URL }}'
          }
          $missingUrls = [System.Collections.Generic.List[string]]::new()
          foreach ($e in $urls.GetEnumerator()) {
            if ($e.Value) {
              Write-Host ("  {0,-20} ✅  {1}" -f $e.Key, $e.Value)
            } else {
              Write-Host ("  {0,-20} ❌  NOT SET" -f $e.Key) -ForegroundColor Red
              $missingUrls.Add($e.Key)
            }
          }
          Write-Host ""
          Write-Host "── Service Connections ─────────────────────────────────"
          $ppAppIdSet    = '${{ secrets.PP_APP_ID != '' }}'     -eq 'true'
          $ppSecretSet   = '${{ secrets.PP_CLIENT_SECRET != '' }}' -eq 'true'
          $ppTenantSet   = '${{ secrets.PP_TENANT_ID != '' }}'  -eq 'true'
          $ghaCorePatSet = '${{ secrets.GHA_CORE_PAT != '' }}'  -eq 'true'
          if ($isMock) {
            Write-Host "  PP_APP_ID            ⚠️  skipped (mock_deploy=true)"
            Write-Host "  PP_CLIENT_SECRET     ⚠️  skipped (mock_deploy=true)"
            Write-Host "  PP_TENANT_ID         ⚠️  skipped (mock_deploy=true)"
          } else {
            Write-Host ("  {0,-20} {1}" -f "PP_APP_ID",        (if ($ppAppIdSet)    { '✅  Set' } else { '❌  NOT SET' }))
            Write-Host ("  {0,-20} {1}" -f "PP_CLIENT_SECRET", (if ($ppSecretSet)   { '✅  Set' } else { '❌  NOT SET' }))
            Write-Host ("  {0,-20} {1}" -f "PP_TENANT_ID",     (if ($ppTenantSet)   { '✅  Set' } else { '❌  NOT SET' }))
          }
          Write-Host ("  {0,-20} {1}" -f "GHA_CORE_PAT",     (if ($ghaCorePatSet) { '✅  Set' } else { '❌  NOT SET' }))
          Write-Host ""
          Write-Host "── JFrog ───────────────────────────────────────────────"
          $jfrogUrl = '${{ vars.JFROG_URL }}'
          if ($jfrogUrl) {
            Write-Host "  JFROG_URL            ✅  $jfrogUrl"
            Write-Host "  JFROG_REPO           ${{ vars.JFROG_REPO || 'powerplatform-solutions (default)' }}"
          } else {
            Write-Host "  JFrog                ⚠️  Not configured (JFROG_URL not set) — archival disabled"
          }
          Write-Host ""
          Write-Host "═══════════════════════════════════════════════════════════"

          # ── Step summary (rendered as a table in GitHub Actions UI) ─────────
          $md  = "## Pipeline Configuration — Run #${{ github.run_number }}`n`n"
          $md += "### Toggles`n`n| Toggle | Value |`n|---|---|`n"
          $md += "| mock_deploy | $(Flag '${{ inputs.mock_deploy }}') |`n"
          $md += "| enable_backup | $(Flag '${{ inputs.enable_backup }}') |`n"
          $md += "| trigger_upgrade | $(Flag '${{ inputs.trigger_upgrade }}') |`n"
          $md += "| checker_error_level | ``${{ inputs.checker_error_level || 'HighIssue' }}`` |`n"
          $md += "| base_solutions | ``${{ inputs.base_solutions || '(none)' }}`` |`n`n"
          $md += "### Solutions (${{ needs.setup.outputs.solution_count }})`n`n"
          $md += "${{ needs.setup.outputs.solution_list }}`n`n"
          $md += "### Environment URLs`n`n| Environment | Status |`n|---|---|`n"
          foreach ($e in $urls.GetEnumerator()) {
            $status = if ($e.Value) { "✅ ``$($e.Value)``" } else { "❌ **NOT SET**" }
            $md += "| $($e.Key) | $status |`n"
          }
          $md += "`n### Service Connections`n`n| Secret | Status |`n|---|---|`n"
          if ($isMock) {
            $md += "| PP credentials | ⚠️ Skipped (mock_deploy=true) |`n"
          } else {
            $md += "| PP_APP_ID | $(if ($ppAppIdSet) { '✅ Set' } else { '❌ **NOT SET**' }) |`n"
            $md += "| PP_CLIENT_SECRET | $(if ($ppSecretSet) { '✅ Set' } else { '❌ **NOT SET**' }) |`n"
            $md += "| PP_TENANT_ID | $(if ($ppTenantSet) { '✅ Set' } else { '❌ **NOT SET**' }) |`n"
          }
          $md += "| GHA_CORE_PAT | $(if ($ghaCorePatSet) { '✅ Set' } else { '❌ **NOT SET**' }) |`n"
          if ($jfrogUrl) {
            $md += "`n### JFrog`n`n✅ Configured — ``$jfrogUrl```n"
          } else {
            $md += "`n### JFrog`n`n⚠️ Not configured — archival disabled`n"
          }
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # ── Fail non-mock if credentials or URLs are missing ─────────────────
          if (-not $isMock) {
            $errors = [System.Collections.Generic.List[string]]::new()
            if (-not $ppAppIdSet)    { $errors.Add('PP_APP_ID secret is not set') }
            if (-not $ppSecretSet)   { $errors.Add('PP_CLIENT_SECRET secret is not set') }
            if (-not $ppTenantSet)   { $errors.Add('PP_TENANT_ID secret is not set') }
            if ($missingUrls.Count -gt 0) {
              $errors.Add("Environment URLs not configured: $($missingUrls -join ', ')")
            }
            if ($errors.Count -gt 0) {
              Write-Host ""
              foreach ($err in $errors) { Write-Host "  ❌ $err" -ForegroundColor Red }
              Write-Error "Pipeline validation failed — fix the above before deploying"
              exit 1
            }
          }
          Write-Host "  ✅ Validation passed"

  # ============================================================================
  # Stage 3a — Deploy Dev + Intg + UAT  (parallel, individual gates)
  # PR creation depends ONLY on this block — PR is opened as soon as UAT passes.
  # ============================================================================
  stage-deploy-preprod:
    name: "🚀 Deploy Dev / Intg / UAT"
    needs: [setup, validate-pipeline]
    if: needs.validate-pipeline.result == 'success'
    permissions:
      id-token: write
      contents: read
      actions:  read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-deploy-chain.yml@main
    with:
      matrix:          ${{ needs.setup.outputs.matrix }}
      environments:    'Dev,Intg,UAT'
      mock_deploy:     ${{ inputs.mock_deploy == true }}
      trigger_upgrade: ${{ inputs.trigger_upgrade == true }}
      base_solutions:  ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
      jfrog_url:       ${{ vars.JFROG_URL || '' }}
      jfrog_repo:      ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      run_number:      ${{ github.run_number }}
      run_attempt:     ${{ github.run_attempt }}

      dev_config: >-
        {"name":"Dev","url":"${{ vars.PP_DEV_URL }}","previous_url":"",
        "solution_type":"Unmanaged","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":false,"enable_version_compare":false,
        "import_config_data":false}

      intg_config: >-
        {"name":"Intg","url":"${{ vars.PP_INTG_URL }}","previous_url":"${{ vars.PP_DEV_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":false,
        "import_config_data":false}

      uat_config: >-
        {"name":"UAT","url":"${{ vars.PP_UAT_URL }}","previous_url":"${{ vars.PP_INTG_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      frs_config: >-
        {"name":"FRS","url":"${{ vars.PP_FRS_URL }}","previous_url":"${{ vars.PP_UAT_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      perf_config: >-
        {"name":"Perf","url":"${{ vars.PP_PERF_URL }}","previous_url":"${{ vars.PP_FRS_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      prod_config: >-
        {"name":"Prod","url":"${{ vars.PP_PROD_URL }}","previous_url":"${{ vars.PP_PERF_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":true}

    secrets: inherit

  # ============================================================================
  # Stage 3b — Deploy FRS + Perf  (parallel, individual gates)
  # Runs concurrently with stage-deploy-preprod — both start after validate-pipeline.
  # FRS/Perf do NOT block PR creation; the PR opens as soon as UAT passes.
  # ============================================================================
  stage-deploy-extended:
    name: "🚀 Deploy FRS / Perf"
    needs: [setup, validate-pipeline]
    if: needs.validate-pipeline.result == 'success'
    permissions:
      id-token: write
      contents: read
      actions:  read
    uses: ppudot2-cloud/GHA-Core/.github/workflows/_stage-deploy-chain.yml@main
    with:
      matrix:          ${{ needs.setup.outputs.matrix }}
      environments:    'FRS,Perf'
      mock_deploy:     ${{ inputs.mock_deploy == true }}
      trigger_upgrade: ${{ inputs.trigger_upgrade == true }}
      base_solutions:  ${{ inputs.base_solutions || vars.PP_BASE_SOLUTIONS || '' }}
      jfrog_url:       ${{ vars.JFROG_URL || '' }}
      jfrog_repo:      ${{ vars.JFROG_REPO || 'powerplatform-solutions' }}
      run_number:      ${{ github.run_number }}
      run_attempt:     ${{ github.run_attempt }}

      dev_config: >-
        {"name":"Dev","url":"${{ vars.PP_DEV_URL }}","previous_url":"",
        "solution_type":"Unmanaged","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":false,"enable_version_compare":false,
        "import_config_data":false}

      intg_config: >-
        {"name":"Intg","url":"${{ vars.PP_INTG_URL }}","previous_url":"${{ vars.PP_DEV_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":false,
        "import_config_data":false}

      uat_config: >-
        {"name":"UAT","url":"${{ vars.PP_UAT_URL }}","previous_url":"${{ vars.PP_INTG_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      frs_config: >-
        {"name":"FRS","url":"${{ vars.PP_FRS_URL }}","previous_url":"${{ vars.PP_UAT_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      perf_config: >-
        {"name":"Perf","url":"${{ vars.PP_PERF_URL }}","previous_url":"${{ vars.PP_FRS_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":false}

      prod_config: >-
        {"name":"Prod","url":"${{ vars.PP_PROD_URL }}","previous_url":"${{ vars.PP_PERF_URL }}",
        "solution_type":"Managed","enable_backup":${{ inputs.enable_backup == true }},
        "enable_blocking_check":true,"enable_version_compare":true,
        "import_config_data":true}

    secrets: inherit

  # ============================================================================
  # Create PR: feature/pipeline-{run_number} → main
  # Opens as soon as UAT passes (stage-deploy-preprod covers Dev + Intg + UAT).
  # FRS and Perf (stage-deploy-extended) continue independently — PR does not
  # wait for them. Merging this PR triggers deploy-prod.yml (UAT re-val + Prod).
  # ============================================================================
  create-main-pr:
    name: "🔀 Open PR → main"
    needs: [setup, commit-to-feature-branch, stage-deploy-preprod]
    if: |
      needs.stage-deploy-preprod.result == 'success' &&
      needs.commit-to-feature-branch.result == 'success' &&
      inputs.mock_deploy != true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Create PR feature → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          FEATURE="${{ needs.commit-to-feature-branch.outputs.feature_branch }}"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "$FEATURE" \
            --base "main" \
            --title "Release: pipeline run #${{ github.run_number }}" \
            --body "## ✅ UAT passed — ready for Prod

          **Pipeline run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Branch:** \`$FEATURE\`
          **Solutions:** ${{ needs.setup.outputs.solution_list }}
          **Triggered by:** @${{ github.actor }}

          ### Gate status at PR creation
          - [x] Solution Checker: passed
          - [x] Dev: success
          - [x] Intg: success
          - [x] UAT: success
          - [ ] FRS: running in parallel (not required for this PR)
          - [ ] Perf: running in parallel (not required for this PR)

          Merging this PR triggers **deploy-prod.yml** (UAT re-validation → Prod, both gated)." \
          )
          echo "✅ PR created: $PR_URL"

  # ============================================================================
  # Pipeline Summary (always runs)
  # ============================================================================
  pipeline-summary:
    name: "📋 Pipeline Summary"
    needs: [setup, stage-export, stage-build, validate-pipeline, stage-deploy-preprod, stage-deploy-extended, create-main-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout GHA-Core CI scripts
        uses: actions/checkout@v4
        with:
          repository: ppudot2-cloud/GHA-Core
          ref: main
          path: .ci
          token: ${{ secrets.GHA_CORE_PAT }}

      - name: Download job summary records
        uses: actions/download-artifact@v4
        with:
          pattern: "job-summary-*"
          path: job-summaries/
          merge-multiple: true
        continue-on-error: true

      - name: Write pipeline summary
        shell: pwsh
        run: |
          & .ci/templates/steps/dynamics/Write-PipelineSummary.ps1 `
            -SolutionList    '${{ needs.setup.outputs.solution_list }}' `
            -SolutionCount   '${{ needs.setup.outputs.solution_count }}' `
            -RunNumber       '${{ github.run_number }}' `
            -RefName         '${{ github.ref_name }}' `
            -CommitSha       '${{ github.sha }}' `
            -ExportResult    '${{ needs.stage-export.result }}' `
            -BuildResult     '${{ needs.stage-build.result }}' `
            -DeployResult    '${{ needs.stage-deploy-preprod.result }}' `
            -JobSummariesDir 'job-summaries'

      - name: Send failure notification
        if: >
          needs.stage-export.result          == 'failure' ||
          needs.stage-build.result           == 'failure' ||
          needs.stage-deploy-preprod.result  == 'failure' ||
          needs.stage-deploy-extended.result == 'failure'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ppudot1@gmail.com
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject:        "❌ Build and Deploy FAILED — ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Pipeline 1 failed for run #${{ github.run_number }}.

            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}

            Stage results:
              Export              : ${{ needs.stage-export.result }}
              Build               : ${{ needs.stage-build.result }}
              Deploy Dev/Intg/UAT : ${{ needs.stage-deploy-preprod.result }}
              Deploy FRS/Perf     : ${{ needs.stage-deploy-extended.result }}

            Solutions: ${{ needs.setup.outputs.solution_list }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
