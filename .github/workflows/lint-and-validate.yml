# =============================================================================
# WORKFLOW: Lint and Validate Configuration
# =============================================================================
#
# PURPOSE
# ─────────────────────────────────────────────────────────────────────────────
# Catches configuration mistakes before they silently break the pipeline.
# Runs on every PR targeting main — required status check for branch protection.
#
# No Azure login or PAC CLI is required — this is pure file-system validation.
#
# WHAT IS CHECKED
# ─────────────────────────────────────────────────────────────────────────────
#
#   solutions.json
#     • Valid JSON (syntax)
#     • Required fields: name, folder, deployOrder, deploymentSettings
#     • solution.folder path exists in the repo
#     • solution.dataSchemaFile path exists (when non-empty)
#     • deployOrder values are positive integers, no duplicates
#     • dependsOn references exist as declared solution names
#
#   deployment-settings/{env}/{solution}.json
#     • All paths declared in solutions.json exist on disk
#     • Each file is valid JSON
#     • Has EnvironmentVariables (array) and ConnectionReferences (array) keys
#     • No unresolved #{...}# tokens whose names are not in project-vars.yml
#       or in the known GitHub Variables/Secrets (reported as warnings, not errors)
#
#   .github/config/project-vars.yml
#     • Valid YAML syntax
#     • Does not declare any protected keys (PP_CHECKER_GEO, PP_CHECKER_ERROR_LEVEL,
#       DEFAULT_SOLUTION_TYPE, ENABLE_BACKUP) — would cause pipeline failure at runtime
#     • No secrets/passwords — values that look like credentials are flagged
#
#   config/{solution}/data-schema.xml
#     • Paths declared in solutions.json exist on disk
#     • Files are well-formed XML
#
# OUTPUT
# ─────────────────────────────────────────────────────────────────────────────
# All errors are emitted as ::error:: annotations (visible on the PR diff).
# All warnings are emitted as ::warning:: annotations.
# The job fails if any error is found.
#
# =============================================================================

name: Lint and Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'solutions.json'
      - 'deployment-settings/**'
      - 'config/**'
      - '.github/config/project-vars.yml'

  # Allow manual dispatch for ad-hoc validation without opening a PR
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # to post inline PR annotations

jobs:
  validate-config:
    name: Validate Pipeline Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml --quiet

      - name: Run configuration validator
        id: validate
        shell: python
        run: |
          import json, yaml, os, sys, re
          from xml.etree import ElementTree as ET

          errors   = []
          warnings = []

          # ──────────────────────────────────────────────────────────────────
          # 1. Parse solutions.json
          # ──────────────────────────────────────────────────────────────────
          SOLUTIONS_FILE = 'solutions.json'
          if not os.path.isfile(SOLUTIONS_FILE):
              errors.append(f'{SOLUTIONS_FILE} not found — this file is required')
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)

          try:
              with open(SOLUTIONS_FILE) as f:
                  raw = json.load(f)
          except json.JSONDecodeError as e:
              errors.append(f'{SOLUTIONS_FILE}: invalid JSON — {e}')
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)

          solutions = raw.get('solutions', [])
          if not solutions:
              errors.append(f'{SOLUTIONS_FILE}: "solutions" array is empty or missing')

          # ──────────────────────────────────────────────────────────────────
          # 2. Validate each solution entry
          # ──────────────────────────────────────────────────────────────────
          solution_names = {s.get('name') for s in solutions if s.get('name')}
          deploy_orders  = []

          for sol in solutions:
              name = sol.get('name', '<unnamed>')

              # Required fields
              for field in ('name', 'folder', 'deployOrder', 'deploymentSettings'):
                  if field not in sol:
                      errors.append(f'[{name}] Missing required field: "{field}"')

              # folder must exist
              folder = sol.get('folder', '')
              if folder and not os.path.isdir(folder):
                  errors.append(f'[{name}] folder "{folder}" does not exist')

              # deployOrder must be a positive integer, no duplicates
              deploy_order = sol.get('deployOrder')
              if deploy_order is not None:
                  if not isinstance(deploy_order, int) or deploy_order < 1:
                      errors.append(f'[{name}] deployOrder must be a positive integer, got: {deploy_order!r}')
                  elif deploy_order in deploy_orders:
                      errors.append(f'[{name}] deployOrder {deploy_order} is a duplicate — each solution must have a unique deployOrder')
                  else:
                      deploy_orders.append(deploy_order)

              # dependsOn entries must reference valid solution names
              for dep in sol.get('dependsOn', []):
                  if dep not in solution_names:
                      warnings.append(f'[{name}] dependsOn "{dep}" is not declared in solutions.json')

              # dataSchemaFile must exist if non-empty
              schema_file = sol.get('dataSchemaFile', '')
              if schema_file:
                  if not os.path.isfile(schema_file):
                      errors.append(f'[{name}] dataSchemaFile "{schema_file}" does not exist')
                  else:
                      # Well-formed XML check
                      try:
                          ET.parse(schema_file)
                      except ET.ParseError as e:
                          errors.append(f'[{name}] dataSchemaFile "{schema_file}" is not valid XML: {e}')

              # deploymentSettings paths
              settings = sol.get('deploymentSettings', {})
              if not isinstance(settings, dict):
                  errors.append(f'[{name}] deploymentSettings must be an object')
                  continue

              for env_name, path in settings.items():
                  if not path:
                      warnings.append(f'[{name}/{env_name}] deploymentSettings path is empty — no variable overrides will be applied')
                      continue
                  if not os.path.isfile(path):
                      errors.append(f'[{name}/{env_name}] deploymentSettings file "{path}" does not exist')
                      continue

                  # Valid JSON check
                  try:
                      with open(path) as f:
                          ds = json.load(f)
                  except json.JSONDecodeError as e:
                      errors.append(f'[{name}/{env_name}] "{path}": invalid JSON — {e}')
                      continue

                  # Required structure
                  for key in ('EnvironmentVariables', 'ConnectionReferences'):
                      if key not in ds:
                          warnings.append(f'[{name}/{env_name}] "{path}": missing "{key}" array (will default to empty)')
                      elif not isinstance(ds[key], list):
                          errors.append(f'[{name}/{env_name}] "{path}": "{key}" must be an array')

                  # Check for unresolved #{...}# tokens — warn but don't fail
                  # (tokens are resolved from AKV at deploy time; we can't verify them here)
                  ds_str = open(path).read()
                  unresolved = re.findall(r'#\{([^}]+)\}#', ds_str)
                  if unresolved:
                      for token in unresolved:
                          warnings.append(
                              f'[{name}/{env_name}] "{path}": token "#{{{token}}}#" — '
                              f'ensure "{token}" is stored in Azure Key Vault or as a GitHub Variable/Secret'
                          )

          # ──────────────────────────────────────────────────────────────────
          # 3. Validate project-vars.yml
          # ──────────────────────────────────────────────────────────────────
          PROJ_VARS_FILE = '.github/config/project-vars.yml'
          PROTECTED_KEYS = {'PP_CHECKER_GEO', 'PP_CHECKER_ERROR_LEVEL', 'DEFAULT_SOLUTION_TYPE', 'ENABLE_BACKUP'}

          if os.path.isfile(PROJ_VARS_FILE):
              try:
                  with open(PROJ_VARS_FILE) as f:
                      proj = yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f'{PROJ_VARS_FILE}: invalid YAML — {e}')
                  proj = None

              if proj and isinstance(proj.get('variables'), dict):
                  for key in PROTECTED_KEYS:
                      if key in proj['variables']:
                          errors.append(
                              f'{PROJ_VARS_FILE}: contains protected key "{key}" — '
                              f'this will cause Merge-Variables.ps1 to exit 1 at pipeline start'
                          )

                  # Heuristic: warn if a value looks like a credential
                  CRED_PATTERNS = re.compile(r'(password|secret|token|key|apikey|pwd)', re.IGNORECASE)
                  for k, v in proj['variables'].items():
                      if CRED_PATTERNS.search(k) and v and str(v).strip():
                          warnings.append(
                              f'{PROJ_VARS_FILE}: variable "{k}" looks like a credential — '
                              f'secrets must live in Azure Key Vault, not in this file'
                          )
          else:
              warnings.append(f'{PROJ_VARS_FILE} not found — using global defaults from GHA-Core')

          # ──────────────────────────────────────────────────────────────────
          # 4. Output results
          # ──────────────────────────────────────────────────────────────────
          for w in warnings:
              print(f'::warning::{w}')

          if errors:
              print(f'')
              print(f'::error::Found {len(errors)} error(s) — fix all errors before merging:')
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          else:
              print(f'')
              print(f'✅ Validated {len(solutions)} solution(s) — {len(warnings)} warning(s), 0 errors')

      - name: Write validation summary
        if: always()
        shell: python
        run: |
          import json, os

          solutions_count = 0
          try:
              with open('solutions.json') as f:
                  data = json.load(f)
              solutions_count = len(data.get('solutions', []))
          except Exception:
              pass

          outcome = '${{ steps.validate.outcome }}'
          icon    = '✅' if outcome == 'success' else '❌'

          summary = f"""## {icon} Configuration Lint

          | Check | Value |
          |---|---|
          | solutions.json | {solutions_count} solution(s) |
          | Result | **{outcome.upper()}** |
          | Triggered by | ${{ github.actor }} |
          | Branch | ${{ github.head_ref || github.ref_name }} |

          > Run `python3 scripts/compute-solutions.py --selection all` locally to also
          > verify the matrix generation logic.
          """

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write(summary)
