# =============================================================================
# PROJECT VARIABLES — GHA-Dynamics (project layer)
# =============================================================================
# This file is the PROJECT LAYER of a two-file variable system:
#
#   LAYER 1 — GHA-CICD-Core/.github/variables/dynamics/global-vars.yml
#               Org-wide defaults maintained by the platform team.
#               Defines protected_keys that this file CANNOT override.
#
#   LAYER 2 — THIS FILE (.github/config/project-vars.yml)
#               Project-specific values. The setup job merges both files at
#               runtime: globals first, then project overrides (except protected
#               keys). Any attempt to set a protected key exits the pipeline
#               with a clear error.
#
# GOVERNANCE RULES:
#   • Variables listed in global-vars.yml → protected_keys CANNOT appear here.
#   • The pipeline merge step exits 1 with a clear error if a violation is found.
#   • All non-protected global defaults can be overridden here.
#
# SENSITIVE VALUES:
#   Do NOT store secrets (tokens, passwords, connection strings) here.
#   Secrets live exclusively in Azure Key Vault. This file is source-controlled
#   and visible to anyone with repo access.
#
# PROJECT-LEVEL AZURE IDENTITY (configured in the variables: block below):
#   Non-sensitive resource identifiers — safe to commit to source control.
#
#   AZURE_CLIENT_ID       — App Registration Client ID for this project's SPN
#   AZURE_TENANT_ID       — Azure AD Tenant ID for this project
#   AZURE_SUBSCRIPTION_ID — Azure Subscription ID
#   AZURE_KEY_VAULT_NAME  — Default Key Vault (override per-environment in environments: block)
#
#   Each project has its own Key Vault and App Registration. This lets you rotate
#   credentials and scope access independently per project.
#
# ENVIRONMENT URLS + AZURE IDENTITY:
#   All environment URLs and the per-environment Key Vault name are configured
#   in the `environments:` block below. The pipeline reads them at runtime —
#   no PP_*_URL or AZURE_KEY_VAULT_NAME GitHub Repository Variables are needed.
#
# AZURE_KEY_VAULT_NAME per environment:
#   Set key_vault_name on any environment that uses a different Key Vault from
#   the project default (AZURE_KEY_VAULT_NAME in the variables block above).
#   Typical pattern: non-prod environments share one KV; Prod has its own KV.
#   Environments that omit key_vault_name inherit the project default.
#
# ENABLE_ROLLBACK:
#   Set as a GitHub Environment variable (Settings → Environments → <name>)
#   to take a pre-import backup and auto-restore on failure. This is an
#   operational toggle — can be changed without a commit.
# =============================================================================

variables:
  # ── Sandbox (export source) ─────────────────────────────────────────────────
  PP_SDBX_URL: "https://cicddev.crm.dynamics.com"

  # ── Project solution ────────────────────────────────────────────────────────
  PP_SOLUTION_NAME:     "YourSolutionName"
  PP_DATA_SCHEMA_FILE:  "config/data-schema.xml"   # leave blank to skip data export

  # ── Base solutions for version-compare ─────────────────────────────────────
  # Comma-separated list of prerequisite solution unique names.
  # Example: "nfBase,nfCustomizations,nfShared"
  # Leave empty to skip base-solution checks.
  PP_BASE_SOLUTIONS:    ""

  # ── Azure OIDC identity (project-level — same across all environments) ──────
  # Set these values for this project's App Registration.
  # Non-sensitive identifiers — safe to commit. Secrets stay in Key Vault.
  AZURE_CLIENT_ID:       ""
  AZURE_TENANT_ID:       ""
  AZURE_SUBSCRIPTION_ID: ""

  # ── Default Azure Key Vault name ─────────────────────────────────────────────
  # Used by export and build stages, and as the fallback for any environment
  # that does not set its own key_vault_name in the environments block below.
  # Prod typically uses a separate KV — override it per-environment below.
  AZURE_KEY_VAULT_NAME:  ""


# =============================================================================
# ENVIRONMENT REGISTRY
# =============================================================================
# Single source of truth for all deployment environments.
# Each entry drives one deploy job in the pipeline. The setup job reads this
# block at runtime — no GitHub Repository Variables are needed for URLs.
#
# Fields:
#   name                 — must match the GitHub Environment name exactly
#                          (Settings → Environments → <name>)
#   url                  — Power Platform Dataverse environment URL
#   key_vault_name       — Azure Key Vault name for this environment (optional;
#                          omit to inherit AZURE_KEY_VAULT_NAME from variables block)
#   enable_blocking_check— block on active flows/ownership locks before import
#   enable_version_compare—skip import if installed version >= artifact version
#   import_config_data   — run config data migration after solution import
#   is_prod              — true = production environment, deployed by Pipeline 2
#                          (deploy-prod.yml). Pipeline 1 skips is_prod environments.
#
# NOTE: solution_type is NOT configurable here. It is enforced by the pipeline:
#   Dev  → Unmanaged  (always)
#   All others → Managed  (always)
#
# ADDING A NEW ENVIRONMENT:
#   1. Add an entry below in the desired position (order = deploy sequence)
#   2. Add a deploy-<name> job to GHA-CICD-Core/_stage-deploy-chain.yml
#   3. Create the GitHub Environment: Settings → Environments → New environment
#   4. Add a Federated Credential on the Azure App Registration:
#      subject: repo:{org}/{repo}:environment:{EnvName}
#
# ENABLE_ROLLBACK (not configured here — it's an operational toggle):
#   Set ENABLE_ROLLBACK=true as a GitHub Environment variable per environment.
# =============================================================================

environments:
  - name:                   Dev
    url:                    "https://cicd-dev.crm.dynamics.com"
    key_vault_name:         ""   # inherits AZURE_KEY_VAULT_NAME from variables block
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     false

  - name:                   Intg
    url:                    "https://cicd-intg.crm.dynamics.com"
    key_vault_name:         ""   # inherits AZURE_KEY_VAULT_NAME from variables block
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     false

  - name:                   UAT
    url:                    "https://cicd-uat.crm.dynamics.com"
    key_vault_name:         ""   # inherits AZURE_KEY_VAULT_NAME from variables block
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     false

  - name:                   FRS
    url:                    "https://cicd-frs.crm.dynamics.com"
    key_vault_name:         ""   # inherits AZURE_KEY_VAULT_NAME from variables block
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     false

  - name:                   Perf
    url:                    "https://cicd-perf.crm.dynamics.com"
    key_vault_name:         ""   # inherits AZURE_KEY_VAULT_NAME from variables block
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     false

  - name:                   Prod
    url:                    "https://cicd-prod.crm.dynamics.com"
    key_vault_name:         ""   # set to prod-specific KV if it differs from the default
    enable_blocking_check:  true
    enable_version_compare: true
    import_config_data:     true
    is_prod:                true
